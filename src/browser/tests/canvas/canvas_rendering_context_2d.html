<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=CanvasRenderingContext2D>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");
  testing.expectEqual(true, ctx instanceof CanvasRenderingContext2D);
  // We can't really test this but let's try to call it at least.
  ctx.fillRect(0, 0, 0, 0);
}
</script>

<script id=CanvasRenderingContext2D#fillStyle>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  // Black by default.
  testing.expectEqual(ctx.fillStyle, "#000000");
  ctx.fillStyle = "red";
  testing.expectEqual(ctx.fillStyle, "#ff0000");
  ctx.fillStyle = "rebeccapurple";
  testing.expectEqual(ctx.fillStyle, "#663399");
  // No changes made if color is invalid.
  ctx.fillStyle = "invalid-color";
  testing.expectEqual(ctx.fillStyle, "#663399");
  ctx.fillStyle = "#fc0";
  testing.expectEqual(ctx.fillStyle, "#ffcc00");
  ctx.fillStyle = "#ff0000";
  testing.expectEqual(ctx.fillStyle, "#ff0000");
  ctx.fillStyle = "#fF00000F";
  testing.expectEqual(ctx.fillStyle, "rgba(255, 0, 0, 0.06)");
}
</script>

<script id="CanvasRenderingContext2D#createImageData(width, height)">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const imageData = ctx.createImageData(100, 200);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 100);
  testing.expectEqual(imageData.height, 200);
  testing.expectEqual(imageData.data.length, 100 * 200 * 4);
  testing.expectEqual(true, imageData.data instanceof Uint8ClampedArray);

  // All pixels should be initialized to 0.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);
}
</script>

<script id="CanvasRenderingContext2D#createImageData(imageData)">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const source = ctx.createImageData(50, 75);
  const imageData = ctx.createImageData(source);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 50);
  testing.expectEqual(imageData.height, 75);
  testing.expectEqual(imageData.data.length, 50 * 75 * 4);
}
</script>

<script id="CanvasRenderingContext2D#putImageData">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const imageData = ctx.createImageData(10, 10);
  testing.expectEqual(true, imageData instanceof ImageData);
  // Modify some pixel data.
  imageData.data[0] = 255;
  imageData.data[1] = 0;
  imageData.data[2] = 0;
  imageData.data[3] = 255;

  // putImageData should not throw.
  ctx.putImageData(imageData, 0, 0);
  ctx.putImageData(imageData, 10, 20);
  // With dirty rect parameters.
  ctx.putImageData(imageData, 0, 0, 0, 0, 5, 5);
}
</script>

<script id="CanvasRenderingContext2D#getImageData">
{
  const element = document.createElement("canvas");
  element.width = 100;
  element.height = 50;
  const ctx = element.getContext("2d");

  const imageData = ctx.getImageData(0, 0, 10, 20);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 10);
  testing.expectEqual(imageData.height, 20);
  testing.expectEqual(imageData.data.length, 10 * 20 * 4);
  testing.expectEqual(true, imageData.data instanceof Uint8ClampedArray);

  // Undrawn canvas should return transparent black pixels.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);
}
</script>

<script id="CanvasRenderingContext2D#getImageData after fillRect">
{
  const element = document.createElement("canvas");
  element.width = 16;
  element.height = 16;
  const ctx = element.getContext("2d");

  ctx.fillStyle = "#ff0000";
  ctx.fillRect(0, 0, 16, 16);

  const pixel = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(255, pixel[0]);
  testing.expectEqual(0, pixel[1]);
  testing.expectEqual(0, pixel[2]);
  testing.expectEqual(255, pixel[3]);
  testing.expectEqual(true, element.toDataURL().startsWith("data:image/png;base64,"));

  const outside = ctx.getImageData(16, 0, 1, 1).data;
  testing.expectEqual(0, outside[0]);
  testing.expectEqual(0, outside[1]);
  testing.expectEqual(0, outside[2]);
  testing.expectEqual(0, outside[3]);

  ctx.clearRect(0, 0, 16, 16);
  const cleared = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(0, cleared[0]);
  testing.expectEqual(0, cleared[1]);
  testing.expectEqual(0, cleared[2]);
  testing.expectEqual(0, cleared[3]);
}
</script>

<script id="HTMLCanvasElement#toBlob" type=module>
{
  const state = await testing.async();
  const element = document.createElement("canvas");
  element.width = 16;
  element.height = 16;
  const ctx = element.getContext("2d");
  ctx.fillStyle = "#00ff00";
  ctx.fillRect(0, 0, 16, 16);

  let callbackSync = true;
  element.toBlob(async (blob) => {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    state.resolve({
      callbackAsync: callbackSync === false,
      isBlob: blob instanceof Blob,
      type: blob.type,
      size: blob.size,
      pngSignature: bytes.length >= 8 &&
        bytes[0] === 0x89 &&
        bytes[1] === 0x50 &&
        bytes[2] === 0x4e &&
        bytes[3] === 0x47,
    });
  }, "image/png");
  callbackSync = false;

  await state.done((result) => {
    testing.expectEqual(true, result.callbackAsync);
    testing.expectEqual(true, result.isBlob);
    testing.expectEqual("image/png", result.type);
    testing.expectTrue(result.size > 0);
    testing.expectEqual(true, result.pngSignature);
  });
}
</script>

<script id="CanvasRenderingContext2D#getImageData invalid">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  // Zero or negative width/height should throw IndexSizeError.
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 0, 10));
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 10, 0));
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, -5, 10));
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 10, -5));
}
</script>


<script id="CanvasRenderingContext2D#canvas">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");
  testing.expectEqual(ctx.canvas, element);
  // Setting dimensions via ctx.canvas should update the element.
  ctx.canvas.width = 40;
  ctx.canvas.height = 25;
  testing.expectEqual(element.width, 40);
  testing.expectEqual(element.height, 25);
}
</script>

<script id="getter">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");
  testing.expectEqual('10px sans-serif', ctx.font);
  ctx.font = 'bold 48px serif'
  testing.expectEqual('bold 48px serif', ctx.font);

}
</script>

<script id="CanvasRenderingContext2D#measureText and fillText">
{
  const element = document.createElement("canvas");
  element.width = 96;
  element.height = 32;
  const ctx = element.getContext("2d");
  const metrics = ctx.measureText("Chimera");
  testing.expectEqual(true, metrics instanceof TextMetrics);
  testing.expectEqual(true, metrics.width > 0);
  testing.expectEqual(true, metrics.actualBoundingBoxRight > 0);
  testing.expectEqual("10px sans-serif", ctx.font);
  ctx.font = "bold 48px serif";
  const largeMetrics = ctx.measureText("Chimera");
  testing.expectEqual("bold 48px serif", ctx.font);
  testing.expectEqual(true, largeMetrics.width > metrics.width);
  testing.expectEqual(true, largeMetrics.actualBoundingBoxAscent > metrics.actualBoundingBoxAscent);
  ctx.font = "16px Arial";
  testing.expectEqual("16px Arial", ctx.font);
  ctx.font = "16px";
  testing.expectEqual("16px Arial", ctx.font);
  ctx.font = "not-a-font";
  testing.expectEqual("16px Arial", ctx.font);
  ctx.font = "18px/1.2 Arial";
  testing.expectEqual("18px/1.2 Arial", ctx.font);

  const before = ctx.getImageData(2, 12, 1, 1).data;
  testing.expectEqual(0, before[3]);
  ctx.fillStyle = "#111111";
  ctx.fillText("Chimera", 2, 22);
  const after = ctx.getImageData(2, 12, 1, 1).data;
  testing.expectEqual(true, after[3] > 0);

  ctx.clearRect(0, 0, 96, 32);
  ctx.fillText("Chimera", 2, 22, 6);
  const insideLimitedWidth = ctx.getImageData(5, 12, 1, 1).data;
  const outsideLimitedWidth = ctx.getImageData(12, 12, 1, 1).data;
  testing.expectEqual(true, insideLimitedWidth[3] > 0);
  testing.expectEqual(0, outsideLimitedWidth[3]);
}
</script>

<script id=identity>
{
  const element = document.createElement('canvas');
  const ctx = element.getContext('2d');

  testing.expectTrue(ctx === element.getContext('2d'));
  testing.expectEqual(null, element.getContext('webgl'));
}
</script>

<script id="CanvasRenderingContext2D#drawImage">
{
  const ctx = document.createElement('canvas').getContext('2d');
  const img = new Image();
  const src = document.createElement('canvas');
  // No-op, but must accept the (image, dx, dy), (image, dx, dy, dw, dh) and
  // 9-arg overloads without throwing.
  ctx.drawImage(img, 0, 0);
  ctx.drawImage(src, 0, 0, 10, 10);
  testing.expectEqual(undefined, ctx.drawImage(src, 0, 0, 10, 10, 0, 0, 10, 10));
}
</script>

<script id="CanvasRenderingContext2D#isPointInPath">
{
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.rect(0, 0, 10, 10);
  ctx.rect(2, 2, 6, 6);

  testing.expectEqual(true, ctx.isPointInPath(5, 5));
  testing.expectEqual(false, ctx.isPointInPath(5, 5, "evenodd"));
  testing.expectEqual(true, ctx.isPointInPath(1, 1, "evenodd"));
  testing.expectEqual(false, ctx.isPointInPath(20, 20));
  testing.expectEqual(false, ctx.isPointInStroke(5, 5));

  ctx.beginPath();
  testing.expectEqual(false, ctx.isPointInPath(5, 5));

  ctx.rect(10, 10, -10, -10);
  testing.expectEqual(true, ctx.isPointInPath(5, 5));
}
</script>
