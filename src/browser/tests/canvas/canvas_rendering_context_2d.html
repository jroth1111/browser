<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=CanvasRenderingContext2D>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");
  testing.expectEqual(true, ctx instanceof CanvasRenderingContext2D);
  // We can't really test this but let's try to call it at least.
  ctx.fillRect(0, 0, 0, 0);
}
</script>

<script id=CanvasRenderingContext2D#fillStyle>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  // Black by default.
  testing.expectEqual(ctx.fillStyle, "#000000");
  ctx.fillStyle = "red";
  testing.expectEqual(ctx.fillStyle, "#ff0000");
  ctx.fillStyle = "rebeccapurple";
  testing.expectEqual(ctx.fillStyle, "#663399");
  // No changes made if color is invalid.
  ctx.fillStyle = "invalid-color";
  testing.expectEqual(ctx.fillStyle, "#663399");
  ctx.fillStyle = "#fc0";
  testing.expectEqual(ctx.fillStyle, "#ffcc00");
  ctx.fillStyle = "#ff0000";
  testing.expectEqual(ctx.fillStyle, "#ff0000");
  ctx.fillStyle = "#fF00000F";
  testing.expectEqual(ctx.fillStyle, "rgba(255, 0, 0, 0.06)");
}
</script>

<script id=CanvasRenderingContext2D#strokeStyle-and-lineWidth>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  testing.expectEqual(ctx.strokeStyle, "#000000");
  ctx.strokeStyle = "#03f";
  testing.expectEqual(ctx.strokeStyle, "#0033ff");
  ctx.strokeStyle = "invalid-color";
  testing.expectEqual(ctx.strokeStyle, "#0033ff");

  testing.expectEqual(1, ctx.lineWidth);
  ctx.lineWidth = 2;
  testing.expectEqual(2, ctx.lineWidth);
  ctx.lineWidth = -10;
  testing.expectEqual(2, ctx.lineWidth);
  ctx.lineWidth = Number.POSITIVE_INFINITY;
  testing.expectEqual(2, ctx.lineWidth);
}
</script>

<script id="CanvasRenderingContext2D#createImageData(width, height)">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const imageData = ctx.createImageData(100, 200);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 100);
  testing.expectEqual(imageData.height, 200);
  testing.expectEqual(imageData.data.length, 100 * 200 * 4);
  testing.expectEqual(true, imageData.data instanceof Uint8ClampedArray);

  // All pixels should be initialized to 0.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);
}
</script>

<script id="CanvasRenderingContext2D#createImageData(imageData)">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const source = ctx.createImageData(50, 75);
  const imageData = ctx.createImageData(source);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 50);
  testing.expectEqual(imageData.height, 75);
  testing.expectEqual(imageData.data.length, 50 * 75 * 4);
}
</script>

<script id="CanvasRenderingContext2D#putImageData">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const imageData = ctx.createImageData(10, 10);
  testing.expectEqual(true, imageData instanceof ImageData);
  // Modify some pixel data.
  imageData.data[0] = 255;
  imageData.data[1] = 0;
  imageData.data[2] = 0;
  imageData.data[3] = 255;

  ctx.putImageData(imageData, 0, 0);
  imageData.data[0] = 0;
  imageData.data[3] = 0;
  const copied = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(255, copied[0]);
  testing.expectEqual(0, copied[1]);
  testing.expectEqual(0, copied[2]);
  testing.expectEqual(255, copied[3]);

  // Out-of-range writes should not throw.
  ctx.putImageData(imageData, 10, 20);

  const dirty = ctx.createImageData(3, 3);
  const dirtyPixel = ((1 * 3) + 1) * 4;
  dirty.data[dirtyPixel + 0] = 0;
  dirty.data[dirtyPixel + 1] = 0;
  dirty.data[dirtyPixel + 2] = 255;
  dirty.data[dirtyPixel + 3] = 255;
  ctx.putImageData(dirty, 4, 5, 1, 1, 1, 1);
  const dirtyCopied = ctx.getImageData(5, 6, 1, 1).data;
  const dirtyOutside = ctx.getImageData(4, 5, 1, 1).data;
  testing.expectEqual(0, dirtyCopied[0]);
  testing.expectEqual(0, dirtyCopied[1]);
  testing.expectEqual(255, dirtyCopied[2]);
  testing.expectEqual(255, dirtyCopied[3]);
  testing.expectEqual(0, dirtyOutside[3]);
}
</script>

<script id="CanvasRenderingContext2D#drawImage source pixels">
{
  const source = document.createElement("canvas");
  source.width = 4;
  source.height = 4;
  const sourceCtx = source.getContext("2d");
  sourceCtx.fillStyle = "#ff0000";
  sourceCtx.fillRect(0, 0, 2, 4);
  sourceCtx.fillStyle = "#0000ff";
  sourceCtx.fillRect(2, 0, 2, 4);

  const dest = document.createElement("canvas");
  dest.width = 16;
  dest.height = 16;
  const ctx = dest.getContext("2d");
  ctx.drawImage(source, 0, 0);
  const copiedRed = ctx.getImageData(0, 0, 1, 1).data;
  const copiedBlue = ctx.getImageData(2, 0, 1, 1).data;
  testing.expectEqual(255, copiedRed[0]);
  testing.expectEqual(0, copiedRed[2]);
  testing.expectEqual(255, copiedRed[3]);
  testing.expectEqual(0, copiedBlue[0]);
  testing.expectEqual(255, copiedBlue[2]);
  testing.expectEqual(255, copiedBlue[3]);

  ctx.clearRect(0, 0, 16, 16);
  ctx.drawImage(source, 0, 0, 4, 4, 4, 4, 8, 4);
  const scaledRed = ctx.getImageData(5, 5, 1, 1).data;
  const scaledBlue = ctx.getImageData(10, 5, 1, 1).data;
  testing.expectEqual(255, scaledRed[0]);
  testing.expectEqual(0, scaledRed[2]);
  testing.expectEqual(0, scaledBlue[0]);
  testing.expectEqual(255, scaledBlue[2]);

  ctx.clearRect(0, 0, 16, 16);
  ctx.drawImage(source, 2, 0, 2, 4, 6, 6, 2, 4);
  const sourceRectPixel = ctx.getImageData(6, 6, 1, 1).data;
  const outside = ctx.getImageData(5, 6, 1, 1).data;
  testing.expectEqual(0, sourceRectPixel[0]);
  testing.expectEqual(255, sourceRectPixel[2]);
  testing.expectEqual(255, sourceRectPixel[3]);
  testing.expectEqual(0, outside[3]);
}
</script>

<script id="CanvasRenderingContext2D#getImageData">
{
  const element = document.createElement("canvas");
  element.width = 100;
  element.height = 50;
  const ctx = element.getContext("2d");

  const imageData = ctx.getImageData(0, 0, 10, 20);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 10);
  testing.expectEqual(imageData.height, 20);
  testing.expectEqual(imageData.data.length, 10 * 20 * 4);
  testing.expectEqual(true, imageData.data instanceof Uint8ClampedArray);

  // Undrawn canvas should return transparent black pixels.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);
}
</script>

<script id="CanvasRenderingContext2D#getImageData after fillRect">
{
  const element = document.createElement("canvas");
  element.width = 16;
  element.height = 16;
  const ctx = element.getContext("2d");

  ctx.fillStyle = "#ff0000";
  ctx.fillRect(0, 0, 16, 16);

  const pixel = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(255, pixel[0]);
  testing.expectEqual(0, pixel[1]);
  testing.expectEqual(0, pixel[2]);
  testing.expectEqual(255, pixel[3]);
  testing.expectEqual(true, element.toDataURL().startsWith("data:image/png;base64,"));

  const outside = ctx.getImageData(16, 0, 1, 1).data;
  testing.expectEqual(0, outside[0]);
  testing.expectEqual(0, outside[1]);
  testing.expectEqual(0, outside[2]);
  testing.expectEqual(0, outside[3]);

  ctx.clearRect(4, 4, 4, 4);
  const partiallyCleared = ctx.getImageData(5, 5, 1, 1).data;
  const retained = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(0, partiallyCleared[0]);
  testing.expectEqual(0, partiallyCleared[1]);
  testing.expectEqual(0, partiallyCleared[2]);
  testing.expectEqual(0, partiallyCleared[3]);
  testing.expectEqual(255, retained[0]);
  testing.expectEqual(0, retained[1]);
  testing.expectEqual(0, retained[2]);
  testing.expectEqual(255, retained[3]);

  ctx.clearRect(0, 0, 16, 16);
  const cleared = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(0, cleared[0]);
  testing.expectEqual(0, cleared[1]);
  testing.expectEqual(0, cleared[2]);
  testing.expectEqual(0, cleared[3]);
}
</script>

<script id="CanvasRenderingContext2D#globalAlpha and globalCompositeOperation">
{
  const element = document.createElement("canvas");
  element.width = 12;
  element.height = 4;
  const ctx = element.getContext("2d");

  testing.expectEqual(1, ctx.globalAlpha);
  testing.expectEqual("source-over", ctx.globalCompositeOperation);

  ctx.fillStyle = "#ff0000";
  ctx.fillRect(0, 0, 4, 4);
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = "#0000ff";
  ctx.fillRect(0, 0, 4, 4);
  const blended = ctx.getImageData(1, 1, 1, 1).data;
  testing.expectEqual(true, blended[0] >= 120 && blended[0] <= 135);
  testing.expectEqual(0, blended[1]);
  testing.expectEqual(true, blended[2] >= 120 && blended[2] <= 135);
  testing.expectEqual(255, blended[3]);

  ctx.globalAlpha = -1;
  testing.expectEqual(0.5, ctx.globalAlpha);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "copy";
  testing.expectEqual("copy", ctx.globalCompositeOperation);
  ctx.fillStyle = "#00ff00";
  ctx.fillRect(6, 0, 2, 2);
  const copied = ctx.getImageData(6, 0, 1, 1).data;
  testing.expectEqual(0, copied[0]);
  testing.expectEqual(255, copied[1]);
  testing.expectEqual(0, copied[2]);
  testing.expectEqual(255, copied[3]);

  ctx.globalCompositeOperation = "invalid-operation";
  testing.expectEqual("copy", ctx.globalCompositeOperation);
  ctx.globalCompositeOperation = "source-over";
  testing.expectEqual("source-over", ctx.globalCompositeOperation);
}
</script>

<script id="CanvasRenderingContext2D#transform backed paint">
{
  const element = document.createElement("canvas");
  element.width = 24;
  element.height = 24;
  const ctx = element.getContext("2d");

  ctx.fillStyle = "#00aa00";
  ctx.translate(4, 3);
  ctx.fillRect(0, 0, 2, 2);
  const translated = ctx.getImageData(4, 3, 1, 1).data;
  const original = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(true, translated[1] >= 120);
  testing.expectEqual(true, translated[3] >= 200);
  testing.expectEqual(0, original[3]);

  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.fillStyle = "#ff0000";
  ctx.fillRect(5, 5, 2, 2);
  const scaled = ctx.getImageData(10, 10, 1, 1).data;
  const unscaled = ctx.getImageData(5, 5, 1, 1).data;
  testing.expectEqual(true, scaled[0] >= 200);
  testing.expectEqual(true, scaled[3] >= 200);
  testing.expectEqual(0, unscaled[3]);

  ctx.resetTransform();
  ctx.fillStyle = "#0000ff";
  ctx.fillRect(1, 1, 1, 1);
  const reset = ctx.getImageData(1, 1, 1, 1).data;
  testing.expectEqual(true, reset[2] >= 200);
  testing.expectEqual(true, reset[3] >= 200);
}
</script>

<script id="CanvasRenderingContext2D#save restore drawing state">
{
  const element = document.createElement("canvas");
  element.width = 32;
  element.height = 32;
  const ctx = element.getContext("2d");

  ctx.fillStyle = "#00aa00";
  ctx.strokeStyle = "#0033ff";
  ctx.lineWidth = 2;
  ctx.font = "16px Arial";
  ctx.globalAlpha = 0.5;
  ctx.globalCompositeOperation = "copy";
  ctx.translate(6, 24);
  ctx.save();
  ctx.fillStyle = "#ff0000";
  ctx.strokeStyle = "#ff0000";
  ctx.lineWidth = 6;
  ctx.font = "bold 48px serif";
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.translate(20, 0);
  ctx.restore();

  testing.expectEqual("#00aa00", ctx.fillStyle);
  testing.expectEqual("#0033ff", ctx.strokeStyle);
  testing.expectEqual(2, ctx.lineWidth);
  testing.expectEqual("16px Arial", ctx.font);
  testing.expectEqual(0.5, ctx.globalAlpha);
  testing.expectEqual("copy", ctx.globalCompositeOperation);
  testing.expectEqual(true, ctx.measureText("Chimera").actualBoundingBoxAscent < 20);

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.fillRect(0, 0, 2, 2);
  ctx.strokeRect(4, 0, 4, 4);
  const fillPixel = ctx.getImageData(6, 24, 1, 1).data;
  const originPixel = ctx.getImageData(0, 24, 1, 1).data;
  const strokePixel = ctx.getImageData(10, 24, 1, 1).data;
  const strokeCenter = ctx.getImageData(12, 26, 1, 1).data;
  testing.expectEqual(true, fillPixel[1] >= 120);
  testing.expectEqual(true, fillPixel[3] >= 200);
  testing.expectEqual(0, originPixel[3]);
  testing.expectEqual(true, strokePixel[2] >= 200);
  testing.expectEqual(true, strokePixel[3] >= 200);
  testing.expectEqual(0, strokeCenter[3]);

  ctx.restore();
  testing.expectEqual(2, ctx.lineWidth);
  testing.expectEqual("16px Arial", ctx.font);
}
</script>

<script id="HTMLCanvasElement#toBlob" type=module>
{
  const state = await testing.async();
  const element = document.createElement("canvas");
  element.width = 16;
  element.height = 16;
  const ctx = element.getContext("2d");
  ctx.fillStyle = "#00ff00";
  ctx.fillRect(0, 0, 16, 16);

  let callbackSync = true;
  element.toBlob(async (blob) => {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    state.resolve({
      callbackAsync: callbackSync === false,
      isBlob: blob instanceof Blob,
      type: blob.type,
      size: blob.size,
      pngSignature: bytes.length >= 8 &&
        bytes[0] === 0x89 &&
        bytes[1] === 0x50 &&
        bytes[2] === 0x4e &&
        bytes[3] === 0x47,
    });
  }, "image/png");
  callbackSync = false;

  await state.done((result) => {
    testing.expectEqual(true, result.callbackAsync);
    testing.expectEqual(true, result.isBlob);
    testing.expectEqual("image/png", result.type);
    testing.expectTrue(result.size > 0);
    testing.expectEqual(true, result.pngSignature);
  });
}
</script>

<script id="CanvasRenderingContext2D#measureText and fillText">
{
  const element = document.createElement("canvas");
  element.width = 96;
  element.height = 32;
  const ctx = element.getContext("2d");
  const metrics = ctx.measureText("Chimera");
  testing.expectEqual(true, metrics instanceof TextMetrics);
  testing.expectEqual(true, metrics.width > 0);
  testing.expectEqual(true, metrics.actualBoundingBoxRight > 0);
  testing.expectEqual("10px sans-serif", ctx.font);
  ctx.font = "bold 48px serif";
  const largeMetrics = ctx.measureText("Chimera");
  testing.expectEqual("bold 48px serif", ctx.font);
  testing.expectEqual(true, largeMetrics.width > metrics.width);
  testing.expectEqual(true, largeMetrics.actualBoundingBoxAscent > metrics.actualBoundingBoxAscent);
  ctx.font = "16px Arial";
  testing.expectEqual("16px Arial", ctx.font);
  ctx.font = "16px";
  testing.expectEqual("16px Arial", ctx.font);
  ctx.font = "not-a-font";
  testing.expectEqual("16px Arial", ctx.font);
  ctx.font = "18px/1.2 Arial";
  testing.expectEqual("18px/1.2 Arial", ctx.font);

  const before = ctx.getImageData(2, 12, 1, 1).data;
  testing.expectEqual(0, before[3]);
  ctx.fillStyle = "#111111";
  ctx.fillText("Chimera", 2, 22);
  const after = ctx.getImageData(2, 12, 1, 1).data;
  testing.expectEqual(true, after[3] > 0);

  ctx.clearRect(0, 0, 96, 32);
  ctx.fillText("Chimera", 2, 22, 6);
  const insideLimitedWidth = ctx.getImageData(5, 12, 1, 1).data;
  const outsideLimitedWidth = ctx.getImageData(12, 12, 1, 1).data;
  testing.expectEqual(true, insideLimitedWidth[3] > 0);
  testing.expectEqual(0, outsideLimitedWidth[3]);
}
</script>

<script id="CanvasRenderingContext2D#drawImage">
{
  const ctx = document.createElement('canvas').getContext('2d');
  const img = new Image();
  const src = document.createElement('canvas');
  let unsupportedImageThrows = false;
  try {
    ctx.drawImage(img, 0, 0);
  } catch (e) {
    unsupportedImageThrows = e instanceof TypeError;
  }
  testing.expectEqual(true, unsupportedImageThrows);
  testing.expectEqual(undefined, ctx.drawImage(src, 0, 0, 10, 10));
  testing.expectEqual(0, ctx.getImageData(0, 0, 1, 1).data[3]);
  testing.expectEqual(undefined, ctx.drawImage(src, 0, 0, 10, 10, 0, 0, 10, 10));
}
</script>

<script id="CanvasRenderingContext2D#isPointInPath">
{
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.rect(0, 0, 10, 10);
  ctx.rect(2, 2, 6, 6);

  testing.expectEqual(true, ctx.isPointInPath(5, 5));
  testing.expectEqual(false, ctx.isPointInPath(5, 5, "evenodd"));
  testing.expectEqual(true, ctx.isPointInPath(1, 1, "evenodd"));
  testing.expectEqual(false, ctx.isPointInPath(20, 20));
  testing.expectEqual(false, ctx.isPointInStroke(5, 5));

  ctx.beginPath();
  testing.expectEqual(false, ctx.isPointInPath(5, 5));

  ctx.rect(10, 10, -10, -10);
  testing.expectEqual(true, ctx.isPointInPath(5, 5));
}
</script>

<script id="CanvasRenderingContext2D#fill path">
{
  const element = document.createElement("canvas");
  element.width = 24;
  element.height = 24;
  const ctx = element.getContext("2d");

  ctx.fillStyle = "#336699";
  ctx.fillRect(1, 1, 2, 2);
  ctx.beginPath();
  ctx.fill();
  const retained = ctx.getImageData(1, 1, 1, 1).data;
  testing.expectEqual(true, retained[3] > 0);

  ctx.beginPath();
  ctx.rect(4, 4, 8, 8);
  ctx.fill();
  const inside = ctx.getImageData(5, 5, 1, 1).data;
  const outside = ctx.getImageData(15, 15, 1, 1).data;
  const retainedAfterPathFill = ctx.getImageData(1, 1, 1, 1).data;
  testing.expectEqual(true, inside[3] > 0);
  testing.expectEqual(0, outside[3]);
  testing.expectEqual(true, retainedAfterPathFill[3] > 0);

  ctx.clearRect(0, 0, 24, 24);
  ctx.beginPath();
  ctx.rect(0, 0, 12, 12);
  ctx.rect(2, 2, 6, 6);
  ctx.fill("evenodd");
  const edge = ctx.getImageData(1, 1, 1, 1).data;
  const center = ctx.getImageData(5, 5, 1, 1).data;
  testing.expectEqual(true, edge[3] > 0);
  testing.expectEqual(0, center[3]);
}
</script>

<script id="CanvasRenderingContext2D#stroke transformed path">
{
  const element = document.createElement("canvas");
  element.width = 32;
  element.height = 32;
  const ctx = element.getContext("2d");

  ctx.strokeStyle = "#0033ff";
  ctx.lineWidth = 2;
  ctx.translate(4, 4);
  ctx.scale(2, 2);
  ctx.beginPath();
  ctx.rect(2, 2, 4, 3);
  ctx.stroke();

  const edge = ctx.getImageData(8, 8, 1, 1).data;
  const untransformed = ctx.getImageData(2, 2, 1, 1).data;
  const center = ctx.getImageData(12, 11, 1, 1).data;
  testing.expectEqual(true, edge[3] > 0);
  testing.expectEqual(0, untransformed[3]);
  testing.expectEqual(0, center[3]);
  testing.expectEqual(true, ctx.isPointInStroke(8, 8));
  testing.expectEqual(false, ctx.isPointInStroke(2, 2));
  testing.expectEqual(false, ctx.isPointInStroke(12, 11));
}
</script>

<script id="CanvasRenderingContext2D#clip masks future paint">
{
  const element = document.createElement("canvas");
  element.width = 24;
  element.height = 24;
  const ctx = element.getContext("2d");

  ctx.fillStyle = "#ff0000";
  ctx.fillRect(0, 0, 24, 24);
  ctx.beginPath();
  ctx.rect(4, 4, 8, 8);
  ctx.clip();
  ctx.fillStyle = "#00aa00";
  ctx.fillRect(0, 0, 24, 24);

  const clippedInside = ctx.getImageData(5, 5, 1, 1).data;
  const clippedOutside = ctx.getImageData(1, 1, 1, 1).data;
  testing.expectEqual(true, clippedInside[1] >= 120);
  testing.expectEqual(true, clippedInside[3] >= 200);
  testing.expectEqual(true, clippedOutside[0] >= 200);

  ctx.save();
  ctx.beginPath();
  ctx.rect(4, 4, 2, 2);
  ctx.clip();
  ctx.fillStyle = "#0000ff";
  ctx.fillRect(0, 0, 24, 24);
  const nestedInside = ctx.getImageData(5, 5, 1, 1).data;
  const nestedOutside = ctx.getImageData(7, 7, 1, 1).data;
  testing.expectEqual(true, nestedInside[2] >= 180);
  testing.expectEqual(true, nestedOutside[1] >= 120);

  ctx.restore();
  ctx.fillStyle = "#0000ff";
  ctx.fillRect(0, 0, 24, 24);
  const restoredInside = ctx.getImageData(7, 7, 1, 1).data;
  const restoredOutside = ctx.getImageData(14, 14, 1, 1).data;
  testing.expectEqual(true, restoredInside[2] >= 180);
  testing.expectEqual(true, restoredOutside[0] >= 200);
}
</script>

<script id="CanvasRenderingContext2D#curves and arc path">
{
  const element = document.createElement("canvas");
  element.width = 96;
  element.height = 36;
  const ctx = element.getContext("2d");

  ctx.fillStyle = "#00aa00";
  ctx.beginPath();
  ctx.moveTo(4, 30);
  ctx.quadraticCurveTo(18, 4, 32, 30);
  ctx.lineTo(4, 30);
  ctx.fill();
  const quadraticInside = ctx.getImageData(18, 24, 1, 1).data;
  const quadraticOutside = ctx.getImageData(18, 2, 1, 1).data;
  testing.expectEqual(true, quadraticInside[1] >= 120);
  testing.expectEqual(true, quadraticInside[3] >= 200);
  testing.expectEqual(0, quadraticOutside[3]);

  ctx.beginPath();
  ctx.moveTo(38, 30);
  ctx.bezierCurveTo(42, 4, 58, 4, 62, 30);
  ctx.lineTo(38, 30);
  ctx.fill();
  const bezierInside = ctx.getImageData(50, 24, 1, 1).data;
  const bezierOutside = ctx.getImageData(50, 2, 1, 1).data;
  testing.expectEqual(true, bezierInside[1] >= 120);
  testing.expectEqual(true, bezierInside[3] >= 200);
  testing.expectEqual(0, bezierOutside[3]);

  ctx.strokeStyle = "#0033ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(80, 18, 8, 0, Math.PI * 2);
  ctx.stroke();
  const arcEdge = ctx.getImageData(88, 18, 1, 1).data;
  const arcCenter = ctx.getImageData(80, 18, 1, 1).data;
  testing.expectEqual(true, arcEdge[2] >= 180);
  testing.expectEqual(true, arcEdge[3] >= 200);
  testing.expectEqual(0, arcCenter[3]);
  testing.expectEqual(true, ctx.isPointInStroke(88, 18));
  testing.expectEqual(false, ctx.isPointInStroke(80, 18));

  ctx.clearRect(0, 0, 96, 36);
  ctx.strokeStyle = "#ff0000";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(4, 18);
  ctx.arcTo(20, 18, 20, 2, 6);
  ctx.stroke();
  const arcToLine = ctx.getImageData(10, 18, 1, 1).data;
  const arcToCurve = ctx.getImageData(20, 12, 1, 1).data;
  const arcToOutside = ctx.getImageData(4, 10, 1, 1).data;
  testing.expectEqual(true, arcToLine[0] >= 180);
  testing.expectEqual(true, arcToLine[3] >= 200);
  testing.expectEqual(true, arcToCurve[0] >= 180);
  testing.expectEqual(true, arcToCurve[3] >= 200);
  testing.expectEqual(0, arcToOutside[3]);
  testing.expectEqual(true, ctx.isPointInStroke(10, 18));
  testing.expectEqual(true, ctx.isPointInStroke(20, 12));
}
</script>
