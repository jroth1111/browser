<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=OffscreenCanvas>
{
  const canvas = new OffscreenCanvas(256, 256);
  testing.expectEqual(true, canvas instanceof OffscreenCanvas);
  testing.expectEqual(canvas.width, 256);
  testing.expectEqual(canvas.height, 256);
}
</script>

<script id=OffscreenCanvas#width>
{
  const canvas = new OffscreenCanvas(100, 200);
  testing.expectEqual(canvas.width, 100);
  canvas.width = 300;
  testing.expectEqual(canvas.width, 300);
}
</script>

<script id=OffscreenCanvas#height>
{
  const canvas = new OffscreenCanvas(100, 200);
  testing.expectEqual(canvas.height, 200);
  canvas.height = 400;
  testing.expectEqual(canvas.height, 400);
}
</script>

<script id=OffscreenCanvas#getContext>
{
  const canvas = new OffscreenCanvas(64, 64);
  const ctx = canvas.getContext("2d");
  testing.expectEqual(true, ctx instanceof OffscreenCanvasRenderingContext2D);
  // We can't really test rendering but let's try to call it at least.
  ctx.fillRect(0, 0, 10, 10);
}
</script>

<script id=OffscreenCanvas#convertToBlob type=module>
{
  const state = await testing.async();
  const canvas = new OffscreenCanvas(64, 64);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#00ff00";
  ctx.fillRect(0, 0, 64, 64);
  const promise = canvas.convertToBlob();
  testing.expectEqual(true, promise instanceof Promise);
  promise.then(async (blob) => {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    testing.expectEqual(true, blob instanceof Blob);
    testing.expectEqual("image/png", blob.type);
    testing.expectEqual(true, blob.size > 0);
    testing.expectEqual(0x89, bytes[0]);
    testing.expectEqual(0x50, bytes[1]);
    testing.expectEqual(0x4e, bytes[2]);
    testing.expectEqual(0x47, bytes[3]);
    state.resolve();
  });
  await state.done(() => testing.expectEqual(true, true));
}
</script>

<script id=HTMLCanvasElement#transferControlToOffscreen>
{
  const htmlCanvas = document.createElement("canvas");
  htmlCanvas.width = 128;
  htmlCanvas.height = 96;
  const offscreen = htmlCanvas.transferControlToOffscreen();
  testing.expectEqual(true, offscreen instanceof OffscreenCanvas);
  testing.expectEqual(offscreen.width, 128);
  testing.expectEqual(offscreen.height, 96);
}
</script>

<script id=OffscreenCanvasRenderingContext2D#getImageData>
{
  const canvas = new OffscreenCanvas(100, 50);
  const ctx = canvas.getContext("2d");

  const imageData = ctx.getImageData(0, 0, 10, 20);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 10);
  testing.expectEqual(imageData.height, 20);
  testing.expectEqual(imageData.data.length, 10 * 20 * 4);

  // Undrawn canvas should return transparent black pixels.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);

  ctx.fillStyle = "#ff0000";
  ctx.fillRect(0, 0, 10, 20);
  const filled = ctx.getImageData(0, 0, 1, 1);
  testing.expectEqual(true, filled.data[0] >= 200);
  testing.expectEqual(true, filled.data[1] <= 30);
  testing.expectEqual(true, filled.data[2] <= 30);
  testing.expectEqual(true, filled.data[3] >= 200);

  ctx.clearRect(4, 4, 2, 2);
  const cleared = ctx.getImageData(4, 4, 1, 1).data;
  const retained = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(0, cleared[0]);
  testing.expectEqual(0, cleared[1]);
  testing.expectEqual(0, cleared[2]);
  testing.expectEqual(0, cleared[3]);
  testing.expectEqual(true, retained[0] >= 200);
  testing.expectEqual(true, retained[1] <= 30);
  testing.expectEqual(true, retained[2] <= 30);
  testing.expectEqual(true, retained[3] >= 200);

  // Zero or negative dimensions should throw.
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 0, 10));
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 10, -5));
}
</script>

<script id=OffscreenCanvasRenderingContext2D#transform-backed-paint>
{
  const canvas = new OffscreenCanvas(24, 24);
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#00aa00";
  ctx.translate(4, 3);
  ctx.fillRect(0, 0, 2, 2);
  const translated = ctx.getImageData(4, 3, 1, 1).data;
  const original = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(true, translated[1] >= 120);
  testing.expectEqual(true, translated[3] >= 200);
  testing.expectEqual(0, original[3]);

  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.fillStyle = "#ff0000";
  ctx.fillRect(5, 5, 2, 2);
  const scaled = ctx.getImageData(10, 10, 1, 1).data;
  const unscaled = ctx.getImageData(5, 5, 1, 1).data;
  testing.expectEqual(true, scaled[0] >= 200);
  testing.expectEqual(true, scaled[3] >= 200);
  testing.expectEqual(0, unscaled[3]);

  ctx.resetTransform();
  ctx.fillStyle = "#0000ff";
  ctx.fillRect(1, 1, 1, 1);
  const reset = ctx.getImageData(1, 1, 1, 1).data;
  testing.expectEqual(true, reset[2] >= 200);
  testing.expectEqual(true, reset[3] >= 200);
}
</script>

<script id=OffscreenCanvasRenderingContext2D#strokeRect>
{
  const canvas = new OffscreenCanvas(16, 16);
  const ctx = canvas.getContext("2d");

  ctx.strokeStyle = "#0033ff";
  ctx.lineWidth = 2;
  ctx.strokeRect(4, 4, 8, 6);

  const edge = ctx.getImageData(4, 4, 1, 1).data;
  const center = ctx.getImageData(8, 7, 1, 1).data;
  const outside = ctx.getImageData(14, 14, 1, 1).data;
  testing.expectEqual(0, edge[0]);
  testing.expectEqual(51, edge[1]);
  testing.expectEqual(255, edge[2]);
  testing.expectEqual(255, edge[3]);
  testing.expectEqual(0, center[3]);
  testing.expectEqual(0, outside[3]);
}
</script>

<script id=OffscreenCanvasRenderingContext2D#transform-paint>
{
  const canvas = new OffscreenCanvas(16, 16);
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ff0000";
  ctx.translate(4, 3);
  ctx.fillRect(0, 0, 2, 2);

  const origin = ctx.getImageData(0, 0, 1, 1).data;
  const translated = ctx.getImageData(4, 3, 1, 1).data;
  testing.expectEqual(0, origin[3]);
  testing.expectEqual(255, translated[0]);
  testing.expectEqual(0, translated[1]);
  testing.expectEqual(0, translated[2]);
  testing.expectEqual(255, translated[3]);

  ctx.resetTransform();
  ctx.fillStyle = "#0000ff";
  ctx.fillRect(0, 0, 1, 1);
  const reset = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(0, reset[0]);
  testing.expectEqual(0, reset[1]);
  testing.expectEqual(255, reset[2]);
  testing.expectEqual(255, reset[3]);
}
</script>

<script id=OffscreenCanvasRenderingContext2D#putImageData>
{
  const canvas = new OffscreenCanvas(32, 32);
  const ctx = canvas.getContext("2d");

  const imageData = ctx.createImageData(2, 2);
  imageData.data[0] = 255;
  imageData.data[1] = 0;
  imageData.data[2] = 0;
  imageData.data[3] = 255;
  ctx.putImageData(imageData, 0, 0);
  imageData.data[0] = 0;
  imageData.data[3] = 0;
  const copied = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(255, copied[0]);
  testing.expectEqual(0, copied[1]);
  testing.expectEqual(0, copied[2]);
  testing.expectEqual(255, copied[3]);

  const dirty = ctx.createImageData(3, 3);
  const dirtyPixel = ((1 * 3) + 1) * 4;
  dirty.data[dirtyPixel + 0] = 0;
  dirty.data[dirtyPixel + 1] = 0;
  dirty.data[dirtyPixel + 2] = 255;
  dirty.data[dirtyPixel + 3] = 255;
  ctx.putImageData(dirty, 4, 5, 1, 1, 1, 1);
  const dirtyCopied = ctx.getImageData(5, 6, 1, 1).data;
  const dirtyOutside = ctx.getImageData(4, 5, 1, 1).data;
  testing.expectEqual(0, dirtyCopied[0]);
  testing.expectEqual(0, dirtyCopied[1]);
  testing.expectEqual(255, dirtyCopied[2]);
  testing.expectEqual(255, dirtyCopied[3]);
  testing.expectEqual(0, dirtyOutside[3]);
}
</script>

<script id=OffscreenCanvasRenderingContext2D#isPointInPath>
{
  const canvas = new OffscreenCanvas(100, 50);
  const ctx = canvas.getContext("2d");
  ctx.rect(0, 0, 10, 10);
  ctx.rect(2, 2, 6, 6);

  testing.expectEqual(true, ctx.isPointInPath(5, 5));
  testing.expectEqual(false, ctx.isPointInPath(5, 5, "evenodd"));
  testing.expectEqual(true, ctx.isPointInPath(1, 1, "evenodd"));
  testing.expectEqual(false, ctx.isPointInStroke(5, 5));
}
</script>

<script id=OffscreenCanvasRenderingContext2D#fill path>
{
  const canvas = new OffscreenCanvas(24, 24);
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#336699";
  ctx.fillRect(1, 1, 2, 2);
  ctx.beginPath();
  ctx.fill();
  const retained = ctx.getImageData(1, 1, 1, 1).data;
  testing.expectEqual(true, retained[3] > 0);

  ctx.beginPath();
  ctx.rect(4, 4, 8, 8);
  ctx.fill();
  const inside = ctx.getImageData(5, 5, 1, 1).data;
  const outside = ctx.getImageData(15, 15, 1, 1).data;
  const retainedAfterPathFill = ctx.getImageData(1, 1, 1, 1).data;
  testing.expectEqual(true, inside[3] > 0);
  testing.expectEqual(0, outside[3]);
  testing.expectEqual(true, retainedAfterPathFill[3] > 0);

  ctx.clearRect(0, 0, 24, 24);
  ctx.beginPath();
  ctx.rect(0, 0, 12, 12);
  ctx.rect(2, 2, 6, 6);
  ctx.fill("evenodd");
  const edge = ctx.getImageData(1, 1, 1, 1).data;
  const center = ctx.getImageData(5, 5, 1, 1).data;
  testing.expectEqual(true, edge[3] > 0);
  testing.expectEqual(0, center[3]);
}
</script>

<script id=OffscreenCanvasRenderingContext2D#measureText and fillText>
{
  const canvas = new OffscreenCanvas(96, 32);
  const ctx = canvas.getContext("2d");
  const metrics = ctx.measureText("Chimera");
  testing.expectEqual(true, metrics instanceof TextMetrics);
  testing.expectEqual(true, metrics.width > 0);
  testing.expectEqual(true, metrics.actualBoundingBoxRight > 0);
  testing.expectEqual("10px sans-serif", ctx.font);
  ctx.font = "bold 48px serif";
  const largeMetrics = ctx.measureText("Chimera");
  testing.expectEqual("bold 48px serif", ctx.font);
  testing.expectEqual(true, largeMetrics.width > metrics.width);
  testing.expectEqual(true, largeMetrics.actualBoundingBoxAscent > metrics.actualBoundingBoxAscent);
  ctx.font = "16px Arial";
  testing.expectEqual("16px Arial", ctx.font);
  ctx.font = "16px";
  testing.expectEqual("16px Arial", ctx.font);
  ctx.font = "not-a-font";
  testing.expectEqual("16px Arial", ctx.font);
  ctx.font = "18px/1.2 Arial";
  testing.expectEqual("18px/1.2 Arial", ctx.font);

  const before = ctx.getImageData(2, 12, 1, 1).data;
  testing.expectEqual(0, before[3]);
  ctx.fillStyle = "#111111";
  ctx.fillText("Chimera", 2, 22);
  const after = ctx.getImageData(2, 12, 1, 1).data;
  testing.expectEqual(true, after[3] > 0);

  ctx.clearRect(0, 0, 96, 32);
  ctx.fillText("Chimera", 2, 22, 6);
  const insideLimitedWidth = ctx.getImageData(5, 12, 1, 1).data;
  const outsideLimitedWidth = ctx.getImageData(12, 12, 1, 1).data;
  testing.expectEqual(true, insideLimitedWidth[3] > 0);
  testing.expectEqual(0, outsideLimitedWidth[3]);
}
</script>
