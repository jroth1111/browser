<script id=WebGLRenderingContext#getSupportedExtensions>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  testing.expectEqual(true, ctx instanceof WebGLRenderingContext);

  const supportedExtensions = ctx.getSupportedExtensions();
  // The order Chrome prefer.
  const expectedExtensions = [
      "ANGLE_instanced_arrays",
      "EXT_blend_minmax",
      "EXT_clip_control",
      "EXT_color_buffer_half_float",
      "EXT_depth_clamp",
      "EXT_disjoint_timer_query",
      "EXT_float_blend",
      "EXT_frag_depth",
      "EXT_polygon_offset_clamp",
      "EXT_shader_texture_lod",
      "EXT_texture_compression_bptc",
      "EXT_texture_compression_rgtc",
      "EXT_texture_filter_anisotropic",
      "EXT_texture_mirror_clamp_to_edge",
      "EXT_sRGB",
      "KHR_parallel_shader_compile",
      "OES_element_index_uint",
      "OES_fbo_render_mipmap",
      "OES_standard_derivatives",
      "OES_texture_float",
      "OES_texture_float_linear",
      "OES_texture_half_float",
      "OES_texture_half_float_linear",
      "OES_vertex_array_object",
      "WEBGL_blend_func_extended",
      "WEBGL_color_buffer_float",
      "WEBGL_compressed_texture_astc",
      "WEBGL_compressed_texture_etc",
      "WEBGL_compressed_texture_etc1",
      "WEBGL_compressed_texture_pvrtc",
      "WEBGL_compressed_texture_s3tc",
      "WEBGL_compressed_texture_s3tc_srgb",
      "WEBGL_debug_renderer_info",
      "WEBGL_debug_shaders",
      "WEBGL_depth_texture",
      "WEBGL_draw_buffers",
      "WEBGL_lose_context",
      "WEBGL_multi_draw",
      "WEBGL_polygon_mode"
  ];

  testing.expectEqual(expectedExtensions.length, supportedExtensions.length);
  for (let i = 0; i < expectedExtensions.length; i++) {
    testing.expectEqual(expectedExtensions[i], supportedExtensions[i]);
  }
}
</script>

<script id=WebGLRenderingCanvas#getExtension>
// WEBGL_debug_renderer_info
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const rendererInfo = ctx.getExtension("WEBGL_debug_renderer_info");
  testing.expectEqual(true, rendererInfo instanceof WEBGL_debug_renderer_info);

  const { UNMASKED_VENDOR_WEBGL, UNMASKED_RENDERER_WEBGL } = rendererInfo;
  testing.expectEqual(UNMASKED_VENDOR_WEBGL, 0x9245);
  testing.expectEqual(UNMASKED_RENDERER_WEBGL, 0x9246);

  testing.expectEqual("Google Inc. (Apple)", ctx.getParameter(UNMASKED_VENDOR_WEBGL));
  testing.expectEqual("ANGLE (Apple, ANGLE Metal Renderer: Apple M-series, Unspecified Version)", ctx.getParameter(UNMASKED_RENDERER_WEBGL));
}

// WEBGL_lose_context
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const loseContext = ctx.getExtension("WEBGL_lose_context");
  testing.expectEqual(true, loseContext instanceof WEBGL_lose_context);

  loseContext.loseContext();
  loseContext.restoreContext();
}
</script>

<script id=WebGLRenderingContext#getParameter>
{
  const element = document.createElement("canvas");
  element.setAttribute("width", "640");
  element.setAttribute("height", "360");
  const ctx = element.getContext("webgl");

  testing.expectEqual("WebKit", ctx.getParameter(ctx.VENDOR));
  testing.expectEqual("WebKit WebGL", ctx.getParameter(ctx.RENDERER));
  testing.expectEqual("WebGL 1.0 (OpenGL ES 2.0 Chromium)", ctx.getParameter(ctx.VERSION));
  testing.expectEqual("WebGL GLSL ES 1.0 (OpenGL ES GLSL ES 1.0 Chromium)", ctx.getParameter(ctx.SHADING_LANGUAGE_VERSION));
  testing.expectEqual(16384, ctx.getParameter(ctx.MAX_TEXTURE_SIZE));
  testing.expectEqual(16, ctx.getParameter(ctx.MAX_VERTEX_ATTRIBS));
  testing.expectEqual(true, ctx.getParameter(ctx.DEPTH_WRITEMASK));
  testing.expectEqual(false, ctx.getParameter(ctx.BLEND));

  const viewport = ctx.getParameter(ctx.VIEWPORT);
  testing.expectEqual(true, viewport instanceof Int32Array);
  testing.expectEqual(4, viewport.length);
  testing.expectEqual(640, viewport[2]);
  testing.expectEqual(360, viewport[3]);

  const lineWidth = ctx.getParameter(ctx.ALIASED_LINE_WIDTH_RANGE);
  testing.expectEqual(true, lineWidth instanceof Float32Array);
  testing.expectEqual(2, lineWidth.length);
}
</script>

<script id=WebGLRenderingContext#clear_readPixels_and_state>
{
  const element = document.createElement("canvas");
  element.setAttribute("width", "16");
  element.setAttribute("height", "16");
  const ctx = element.getContext("webgl");

  const initialPixels = new Uint8Array(4);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, initialPixels);
  testing.expectEqual(0, initialPixels[0]);
  testing.expectEqual(0, initialPixels[1]);
  testing.expectEqual(0, initialPixels[2]);
  testing.expectEqual(0, initialPixels[3]);

  ctx.clearColor(1, 0, 0, 1);
  const clearColor = ctx.getParameter(ctx.COLOR_CLEAR_VALUE);
  testing.expectEqual(true, clearColor instanceof Float32Array);
  testing.expectEqual(1, clearColor[0]);
  testing.expectEqual(0, clearColor[1]);
  testing.expectEqual(0, clearColor[2]);
  testing.expectEqual(1, clearColor[3]);

  ctx.clear(ctx.COLOR_BUFFER_BIT);
  const redPixels = new Uint8Array(8);
  ctx.readPixels(0, 0, 2, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, redPixels);
  testing.expectEqual(255, redPixels[0]);
  testing.expectEqual(0, redPixels[1]);
  testing.expectEqual(0, redPixels[2]);
  testing.expectEqual(255, redPixels[3]);
  testing.expectEqual(255, redPixels[4]);
  testing.expectEqual(0, redPixels[5]);
  testing.expectEqual(0, redPixels[6]);
  testing.expectEqual(255, redPixels[7]);

  ctx.viewport(1, 2, 3, 4);
  const viewport = ctx.getParameter(ctx.VIEWPORT);
  testing.expectEqual(1, viewport[0]);
  testing.expectEqual(2, viewport[1]);
  testing.expectEqual(3, viewport[2]);
  testing.expectEqual(4, viewport[3]);

  ctx.scissor(2, 3, 4, 5);
  const scissor = ctx.getParameter(ctx.SCISSOR_BOX);
  testing.expectEqual(2, scissor[0]);
  testing.expectEqual(3, scissor[1]);
  testing.expectEqual(4, scissor[2]);
  testing.expectEqual(5, scissor[3]);
}
</script>

<script id=WebGLRenderingContext#shader_program_draw_state>
{
  const element = document.createElement("canvas");
  element.setAttribute("width", "16");
  element.setAttribute("height", "16");
  const ctx = element.getContext("webgl");

  const badShader = ctx.createShader(ctx.FRAGMENT_SHADER);
  ctx.shaderSource(badShader, "void nope() {}");
  ctx.compileShader(badShader);
  testing.expectEqual(false, ctx.getShaderParameter(badShader, ctx.COMPILE_STATUS));

  const vertexShader = ctx.createShader(ctx.VERTEX_SHADER);
  ctx.shaderSource(vertexShader, "attribute vec2 position; void main() { gl_Position = vec4(position, 0.0, 1.0); }");
  ctx.compileShader(vertexShader);
  testing.expectEqual(true, ctx.getShaderParameter(vertexShader, ctx.COMPILE_STATUS));
  testing.expectEqual(ctx.VERTEX_SHADER, ctx.getShaderParameter(vertexShader, ctx.SHADER_TYPE));

  const fragmentShader = ctx.createShader(ctx.FRAGMENT_SHADER);
  ctx.shaderSource(fragmentShader, "void main() { gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0); }");
  ctx.compileShader(fragmentShader);
  testing.expectEqual(true, ctx.getShaderParameter(fragmentShader, ctx.COMPILE_STATUS));

  const program = ctx.createProgram();
  ctx.attachShader(program, vertexShader);
  ctx.attachShader(program, fragmentShader);
  testing.expectEqual(2, ctx.getProgramParameter(program, ctx.ATTACHED_SHADERS));
  ctx.linkProgram(program);
  testing.expectEqual(true, ctx.getProgramParameter(program, ctx.LINK_STATUS));
  testing.expectEqual(1, ctx.getProgramParameter(program, ctx.ACTIVE_ATTRIBUTES));
  ctx.useProgram(program);

  const position = ctx.getAttribLocation(program, "position");
  testing.expectEqual(0, position);
  const attrib = ctx.getActiveAttrib(program, 0);
  testing.expectEqual(true, attrib instanceof WebGLActiveInfo);
  testing.expectEqual("position", attrib.name);

  const pixelsBeforeBuffer = new Uint8Array(4);
  ctx.clearColor(0, 0, 0, 1);
  ctx.clear(ctx.COLOR_BUFFER_BIT);
  ctx.drawArrays(ctx.TRIANGLES, 0, 3);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, pixelsBeforeBuffer);
  testing.expectEqual(0, pixelsBeforeBuffer[0]);
  testing.expectEqual(0, pixelsBeforeBuffer[1]);
  testing.expectEqual(0, pixelsBeforeBuffer[2]);
  testing.expectEqual(255, pixelsBeforeBuffer[3]);

  const buffer = ctx.createBuffer();
  ctx.bindBuffer(ctx.ARRAY_BUFFER, buffer);
  ctx.bufferData(ctx.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, 0, 1]), ctx.STATIC_DRAW);
  ctx.enableVertexAttribArray(position);
  ctx.vertexAttribPointer(position, 2, ctx.FLOAT, false, 0, 0);
  ctx.drawArrays(ctx.TRIANGLES, 0, 3);

  const pixelsAfterDraw = new Uint8Array(4);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, pixelsAfterDraw);
  testing.expectEqual(0, pixelsAfterDraw[0]);
  testing.expectEqual(255, pixelsAfterDraw[1]);
  testing.expectEqual(0, pixelsAfterDraw[2]);
  testing.expectEqual(255, pixelsAfterDraw[3]);
}
</script>

<script id=WebGLRenderingContext#texture_sampler_draw_state>
{
  const element = document.createElement("canvas");
  element.setAttribute("width", "16");
  element.setAttribute("height", "16");
  const ctx = element.getContext("webgl");
  testing.expectEqual(ctx.TEXTURE0 + 31, ctx.TEXTURE31);
  ctx.activeTexture(ctx.TEXTURE31);
  testing.expectEqual(ctx.TEXTURE31, ctx.getParameter(ctx.ACTIVE_TEXTURE));

  const texture0 = ctx.createTexture();
  ctx.activeTexture(ctx.TEXTURE0);
  ctx.bindTexture(ctx.TEXTURE_2D, texture0);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MIN_FILTER, ctx.NEAREST);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MAG_FILTER, ctx.NEAREST);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_S, ctx.CLAMP_TO_EDGE);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_T, ctx.CLAMP_TO_EDGE);
  ctx.texImage2D(ctx.TEXTURE_2D, 0, ctx.RGBA, 1, 1, 0, ctx.RGBA, ctx.UNSIGNED_BYTE, new Uint8Array([9, 19, 29, 255]));
  const texture1 = ctx.createTexture();
  ctx.activeTexture(ctx.TEXTURE1);
  ctx.bindTexture(ctx.TEXTURE_2D, texture1);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MIN_FILTER, ctx.NEAREST);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MAG_FILTER, ctx.NEAREST);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_S, ctx.CLAMP_TO_EDGE);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_T, ctx.CLAMP_TO_EDGE);
  ctx.texImage2D(ctx.TEXTURE_2D, 0, ctx.RGBA, 2, 2, 0, ctx.RGBA, ctx.UNSIGNED_BYTE, new Uint8Array([
    37, 47, 57, 255,
    41, 51, 61, 255,
    71, 81, 91, 255,
    97, 107, 117, 255,
  ]));

  const vertexShader = ctx.createShader(ctx.VERTEX_SHADER);
  ctx.shaderSource(vertexShader, "attribute vec2 position; void main() { gl_Position = vec4(position, 0.0, 1.0); }");
  ctx.compileShader(vertexShader);
  testing.expectEqual(true, ctx.getShaderParameter(vertexShader, ctx.COMPILE_STATUS));

  const fragmentShader = ctx.createShader(ctx.FRAGMENT_SHADER);
  ctx.shaderSource(fragmentShader, "precision mediump float; uniform sampler2D u_texture; void main() { gl_FragColor = texture2D(u_texture, vec2(0.25, 0.25)); }");
  ctx.compileShader(fragmentShader);
  testing.expectEqual(true, ctx.getShaderParameter(fragmentShader, ctx.COMPILE_STATUS));

  const program = ctx.createProgram();
  ctx.attachShader(program, vertexShader);
  ctx.attachShader(program, fragmentShader);
  ctx.linkProgram(program);
  testing.expectEqual(true, ctx.getProgramParameter(program, ctx.LINK_STATUS));
  testing.expectEqual(1, ctx.getProgramParameter(program, ctx.ACTIVE_UNIFORMS));
  const activeUniform = ctx.getActiveUniform(program, 0);
  testing.expectEqual(true, activeUniform instanceof WebGLActiveInfo);
  testing.expectEqual("u_texture", activeUniform.name);
  testing.expectEqual(ctx.SAMPLER_2D, activeUniform.type);
  testing.expectEqual(null, ctx.getUniformLocation(program, "missing_texture"));
  ctx.useProgram(program);
  const textureUniform = ctx.getUniformLocation(program, "u_texture");
  testing.expectEqual(true, textureUniform instanceof WebGLUniformLocation);
  ctx.uniform1i(textureUniform, 1);

  const position = ctx.getAttribLocation(program, "position");
  const buffer = ctx.createBuffer();
  ctx.bindBuffer(ctx.ARRAY_BUFFER, buffer);
  ctx.bufferData(ctx.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, 0, 1]), ctx.STATIC_DRAW);
  ctx.enableVertexAttribArray(position);
  ctx.vertexAttribPointer(position, 2, ctx.FLOAT, false, 0, 0);
  ctx.drawArrays(ctx.TRIANGLES, 0, 3);

  const pixels = new Uint8Array(4);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, pixels);
  testing.expectEqual(37, pixels[0]);
  testing.expectEqual(47, pixels[1]);
  testing.expectEqual(57, pixels[2]);
  testing.expectEqual(255, pixels[3]);

  ctx.clearColor(0, 0, 0, 1);
  ctx.clear(ctx.COLOR_BUFFER_BIT);
  ctx.uniform1i(textureUniform, 0);
  ctx.drawArrays(ctx.TRIANGLES, 0, 3);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, pixels);
  testing.expectEqual(9, pixels[0]);
  testing.expectEqual(19, pixels[1]);
  testing.expectEqual(29, pixels[2]);
  testing.expectEqual(255, pixels[3]);

  const coordinateFragmentShader = ctx.createShader(ctx.FRAGMENT_SHADER);
  ctx.shaderSource(coordinateFragmentShader, "precision mediump float; uniform sampler2D u_texture; void main() { gl_FragColor = texture2D(u_texture, vec2(0.75, 0.75)); }");
  ctx.compileShader(coordinateFragmentShader);
  testing.expectEqual(true, ctx.getShaderParameter(coordinateFragmentShader, ctx.COMPILE_STATUS));

  const coordinateProgram = ctx.createProgram();
  ctx.attachShader(coordinateProgram, vertexShader);
  ctx.attachShader(coordinateProgram, coordinateFragmentShader);
  ctx.linkProgram(coordinateProgram);
  testing.expectEqual(true, ctx.getProgramParameter(coordinateProgram, ctx.LINK_STATUS));
  ctx.useProgram(coordinateProgram);
  const coordinateUniform = ctx.getUniformLocation(coordinateProgram, "u_texture");
  testing.expectEqual(true, coordinateUniform instanceof WebGLUniformLocation);
  ctx.uniform1i(coordinateUniform, 1);
  const coordinatePosition = ctx.getAttribLocation(coordinateProgram, "position");
  ctx.enableVertexAttribArray(coordinatePosition);
  ctx.vertexAttribPointer(coordinatePosition, 2, ctx.FLOAT, false, 0, 0);
  ctx.clearColor(0, 0, 0, 1);
  ctx.clear(ctx.COLOR_BUFFER_BIT);
  ctx.drawArrays(ctx.TRIANGLES, 0, 3);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, pixels);
  testing.expectEqual(97, pixels[0]);
  testing.expectEqual(107, pixels[1]);
  testing.expectEqual(117, pixels[2]);
  testing.expectEqual(255, pixels[3]);

  const coordinateFragmentShaderTopLeft = ctx.createShader(ctx.FRAGMENT_SHADER);
  ctx.shaderSource(coordinateFragmentShaderTopLeft, "precision mediump float; uniform sampler2D u_texture; void main() { gl_FragColor = texture2D(u_texture, vec2(0.25, 0.75)); }");
  ctx.compileShader(coordinateFragmentShaderTopLeft);
  testing.expectEqual(true, ctx.getShaderParameter(coordinateFragmentShaderTopLeft, ctx.COMPILE_STATUS));

  const coordinateProgramTopLeft = ctx.createProgram();
  ctx.attachShader(coordinateProgramTopLeft, vertexShader);
  ctx.attachShader(coordinateProgramTopLeft, coordinateFragmentShaderTopLeft);
  ctx.linkProgram(coordinateProgramTopLeft);
  testing.expectEqual(true, ctx.getProgramParameter(coordinateProgramTopLeft, ctx.LINK_STATUS));
  ctx.useProgram(coordinateProgramTopLeft);
  const coordinateTopLeftUniform = ctx.getUniformLocation(coordinateProgramTopLeft, "u_texture");
  testing.expectEqual(true, coordinateTopLeftUniform instanceof WebGLUniformLocation);
  ctx.uniform1i(coordinateTopLeftUniform, 1);
  const coordinateTopLeftPosition = ctx.getAttribLocation(coordinateProgramTopLeft, "position");
  ctx.enableVertexAttribArray(coordinateTopLeftPosition);
  ctx.vertexAttribPointer(coordinateTopLeftPosition, 2, ctx.FLOAT, false, 0, 0);
  ctx.clearColor(0, 0, 0, 1);
  ctx.clear(ctx.COLOR_BUFFER_BIT);
  ctx.drawArrays(ctx.TRIANGLES, 0, 3);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, pixels);
  testing.expectEqual(71, pixels[0]);
  testing.expectEqual(81, pixels[1]);
  testing.expectEqual(91, pixels[2]);
  testing.expectEqual(255, pixels[3]);
}
</script>

<script id=WebGLRenderingContext#texture_framebuffer_readback>
{
  const element = document.createElement("canvas");
  element.setAttribute("width", "16");
  element.setAttribute("height", "16");
  const ctx = element.getContext("webgl");

  const framebuffer = ctx.createFramebuffer();
  ctx.bindFramebuffer(ctx.FRAMEBUFFER, framebuffer);
  testing.expectEqual(true, ctx.isFramebuffer(framebuffer));
  testing.expectEqual(ctx.FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT, ctx.checkFramebufferStatus(ctx.FRAMEBUFFER));

  const texture = ctx.createTexture();
  ctx.bindTexture(ctx.TEXTURE_2D, texture);
  testing.expectEqual(true, ctx.isTexture(texture));
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MIN_FILTER, ctx.NEAREST);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MAG_FILTER, ctx.NEAREST);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_S, ctx.CLAMP_TO_EDGE);
  ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_T, ctx.CLAMP_TO_EDGE);
  ctx.texImage2D(ctx.TEXTURE_2D, 0, ctx.RGBA, 1, 1, 0, ctx.RGBA, ctx.UNSIGNED_BYTE, new Uint8Array([17, 34, 51, 255]));
  ctx.framebufferTexture2D(ctx.FRAMEBUFFER, ctx.COLOR_ATTACHMENT0, ctx.TEXTURE_2D, texture, 0);
  testing.expectEqual(ctx.FRAMEBUFFER_COMPLETE, ctx.checkFramebufferStatus(ctx.FRAMEBUFFER));

  const uploadedPixels = new Uint8Array(4);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, uploadedPixels);
  testing.expectEqual(17, uploadedPixels[0]);
  testing.expectEqual(34, uploadedPixels[1]);
  testing.expectEqual(51, uploadedPixels[2]);
  testing.expectEqual(255, uploadedPixels[3]);

  ctx.clearColor(1, 0, 0, 1);
  ctx.clear(ctx.COLOR_BUFFER_BIT);
  const clearedPixels = new Uint8Array(4);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, clearedPixels);
  testing.expectEqual(255, clearedPixels[0]);
  testing.expectEqual(0, clearedPixels[1]);
  testing.expectEqual(0, clearedPixels[2]);
  testing.expectEqual(255, clearedPixels[3]);

  ctx.bindFramebuffer(ctx.FRAMEBUFFER, null);
  const defaultPixels = new Uint8Array(4);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, defaultPixels);
  testing.expectEqual(0, defaultPixels[0]);
  testing.expectEqual(0, defaultPixels[1]);
  testing.expectEqual(0, defaultPixels[2]);
  testing.expectEqual(0, defaultPixels[3]);
  ctx.bindFramebuffer(ctx.FRAMEBUFFER, framebuffer);

  ctx.deleteTexture(texture);
  testing.expectEqual(false, ctx.isTexture(texture));
  testing.expectEqual(ctx.FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT, ctx.checkFramebufferStatus(ctx.FRAMEBUFFER));
  ctx.deleteFramebuffer(framebuffer);
  testing.expectEqual(false, ctx.isFramebuffer(framebuffer));
}
</script>
