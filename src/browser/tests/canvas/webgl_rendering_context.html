<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=WebGLRenderingContext#getSupportedExtensions>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  testing.expectEqual(true, ctx instanceof WebGLRenderingContext);

  const supportedExtensions = ctx.getSupportedExtensions();
  // The order Chrome prefer.
  const expectedExtensions = [
      "ANGLE_instanced_arrays",
      "EXT_blend_minmax",
      "EXT_clip_control",
      "EXT_color_buffer_half_float",
      "EXT_depth_clamp",
      "EXT_disjoint_timer_query",
      "EXT_float_blend",
      "EXT_frag_depth",
      "EXT_polygon_offset_clamp",
      "EXT_shader_texture_lod",
      "EXT_texture_compression_bptc",
      "EXT_texture_compression_rgtc",
      "EXT_texture_filter_anisotropic",
      "EXT_texture_mirror_clamp_to_edge",
      "EXT_sRGB",
      "KHR_parallel_shader_compile",
      "OES_element_index_uint",
      "OES_fbo_render_mipmap",
      "OES_standard_derivatives",
      "OES_texture_float",
      "OES_texture_float_linear",
      "OES_texture_half_float",
      "OES_texture_half_float_linear",
      "OES_vertex_array_object",
      "WEBGL_blend_func_extended",
      "WEBGL_color_buffer_float",
      "WEBGL_compressed_texture_astc",
      "WEBGL_compressed_texture_etc",
      "WEBGL_compressed_texture_etc1",
      "WEBGL_compressed_texture_pvrtc",
      "WEBGL_compressed_texture_s3tc",
      "WEBGL_compressed_texture_s3tc_srgb",
      "WEBGL_debug_renderer_info",
      "WEBGL_debug_shaders",
      "WEBGL_depth_texture",
      "WEBGL_draw_buffers",
      "WEBGL_lose_context",
      "WEBGL_multi_draw",
      "WEBGL_polygon_mode"
  ];

  testing.expectEqual(expectedExtensions.length, supportedExtensions.length);
  for (let i = 0; i < expectedExtensions.length; i++) {
    testing.expectEqual(expectedExtensions[i], supportedExtensions[i]);
  }
}
</script>

<script id=WebGLRenderingCanvas#getExtension>
// WEBGL_debug_renderer_info
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const rendererInfo = ctx.getExtension("WEBGL_debug_renderer_info");
  testing.expectEqual(true, rendererInfo instanceof WEBGL_debug_renderer_info);

  const { UNMASKED_VENDOR_WEBGL, UNMASKED_RENDERER_WEBGL } = rendererInfo;
  testing.expectEqual(UNMASKED_VENDOR_WEBGL, 0x9245);
  testing.expectEqual(UNMASKED_RENDERER_WEBGL, 0x9246);

  testing.expectEqual("Google Inc. (Apple)", ctx.getParameter(UNMASKED_VENDOR_WEBGL));
  testing.expectEqual("ANGLE (Apple, ANGLE Metal Renderer: Apple M-series, Unspecified Version)", ctx.getParameter(UNMASKED_RENDERER_WEBGL));
}

// WEBGL_lose_context
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const loseContext = ctx.getExtension("WEBGL_lose_context");
  testing.expectEqual(true, loseContext instanceof WEBGL_lose_context);

  loseContext.loseContext();
  loseContext.restoreContext();
}
</script>

<script id=WebGLRenderingContext#getParameter>
{
  const element = document.createElement("canvas");
  element.setAttribute("width", "640");
  element.setAttribute("height", "360");
  const ctx = element.getContext("webgl");

  testing.expectEqual("WebKit", ctx.getParameter(ctx.VENDOR));
  testing.expectEqual("WebKit WebGL", ctx.getParameter(ctx.RENDERER));
  testing.expectEqual("WebGL 1.0 (OpenGL ES 2.0 Chromium)", ctx.getParameter(ctx.VERSION));
  testing.expectEqual("WebGL GLSL ES 1.0 (OpenGL ES GLSL ES 1.0 Chromium)", ctx.getParameter(ctx.SHADING_LANGUAGE_VERSION));
  testing.expectEqual(16384, ctx.getParameter(ctx.MAX_TEXTURE_SIZE));
  testing.expectEqual(16, ctx.getParameter(ctx.MAX_VERTEX_ATTRIBS));
  testing.expectEqual(true, ctx.getParameter(ctx.DEPTH_WRITEMASK));
  testing.expectEqual(false, ctx.getParameter(ctx.BLEND));

  const viewport = ctx.getParameter(ctx.VIEWPORT);
  testing.expectEqual(true, viewport instanceof Int32Array);
  testing.expectEqual(4, viewport.length);
  testing.expectEqual(640, viewport[2]);
  testing.expectEqual(360, viewport[3]);

  const lineWidth = ctx.getParameter(ctx.ALIASED_LINE_WIDTH_RANGE);
  testing.expectEqual(true, lineWidth instanceof Float32Array);
  testing.expectEqual(2, lineWidth.length);
}
</script>

<script id=WebGLRenderingContext#clear_readPixels_and_state>
{
  const element = document.createElement("canvas");
  element.setAttribute("width", "16");
  element.setAttribute("height", "16");
  const ctx = element.getContext("webgl");

  const initialPixels = new Uint8Array(4);
  ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, initialPixels);
  testing.expectEqual(0, initialPixels[0]);
  testing.expectEqual(0, initialPixels[1]);
  testing.expectEqual(0, initialPixels[2]);
  testing.expectEqual(0, initialPixels[3]);

  ctx.clearColor(1, 0, 0, 1);
  const clearColor = ctx.getParameter(ctx.COLOR_CLEAR_VALUE);
  testing.expectEqual(true, clearColor instanceof Float32Array);
  testing.expectEqual(1, clearColor[0]);
  testing.expectEqual(0, clearColor[1]);
  testing.expectEqual(0, clearColor[2]);
  testing.expectEqual(1, clearColor[3]);

  ctx.clear(ctx.COLOR_BUFFER_BIT);
  const redPixels = new Uint8Array(8);
  ctx.readPixels(0, 0, 2, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, redPixels);
  testing.expectEqual(255, redPixels[0]);
  testing.expectEqual(0, redPixels[1]);
  testing.expectEqual(0, redPixels[2]);
  testing.expectEqual(255, redPixels[3]);
  testing.expectEqual(255, redPixels[4]);
  testing.expectEqual(0, redPixels[5]);
  testing.expectEqual(0, redPixels[6]);
  testing.expectEqual(255, redPixels[7]);

  ctx.viewport(1, 2, 3, 4);
  const viewport = ctx.getParameter(ctx.VIEWPORT);
  testing.expectEqual(1, viewport[0]);
  testing.expectEqual(2, viewport[1]);
  testing.expectEqual(3, viewport[2]);
  testing.expectEqual(4, viewport[3]);

  ctx.scissor(2, 3, 4, 5);
  const scissor = ctx.getParameter(ctx.SCISSOR_BOX);
  testing.expectEqual(2, scissor[0]);
  testing.expectEqual(3, scissor[1]);
  testing.expectEqual(4, scissor[2]);
  testing.expectEqual(5, scissor[3]);
}
</script>

<script id=WebGLRenderingContext#objects>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("experimental-webgl");

  testing.expectEqual(true, ctx instanceof WebGLRenderingContext);
  testing.expectEqual(true, ctx.createBuffer() instanceof WebGLBuffer);
  testing.expectEqual(true, ctx.createFramebuffer() instanceof WebGLFramebuffer);
  testing.expectEqual(true, ctx.createProgram() instanceof WebGLProgram);
  testing.expectEqual(true, ctx.createRenderbuffer() instanceof WebGLRenderbuffer);
  testing.expectEqual(true, ctx.createShader(ctx.FRAGMENT_SHADER) instanceof WebGLShader);
  testing.expectEqual(true, ctx.createTexture() instanceof WebGLTexture);
  testing.expectEqual(true, ctx.getShaderPrecisionFormat(ctx.FRAGMENT_SHADER, ctx.HIGH_FLOAT) instanceof WebGLShaderPrecisionFormat);
  testing.expectEqual(0, ctx.getAttribLocation(ctx.createProgram(), "position"));
}
</script>

<script id=identity>
{
  const element = document.createElement('canvas');
  const ctx = element.getContext('webgl');

  testing.expectTrue(ctx === element.getContext('webgl'));
  testing.expectEqual(null, element.getContext('2d'));
}
</script>
