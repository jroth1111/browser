<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=xhr_cors_credentials_wildcard type=module>
  {
    const state = await testing.async();
    const req = new XMLHttpRequest();
    req.onload = () => state.resolve();
    req.open('GET', `${testing.CORS_ORIGIN}/cors/credentials-wildcard-expose`);
    req.withCredentials = true;
    req.send();

    await state.done(() => {
      testing.expectEqual(200, req.status);
      testing.expectEqual('credentialed-wildcard', req.responseText);
      testing.expectEqual('text/plain', req.getResponseHeader('content-type'));
      testing.expectEqual(null, req.getResponseHeader('x-wildcard-credentials-proof'));
    });
  }
</script>
