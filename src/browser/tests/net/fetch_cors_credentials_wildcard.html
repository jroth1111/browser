<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=fetch_cors_credentials_wildcard type=module>
  {
    const state = await testing.async();
    const response = await fetch(`${testing.CORS_ORIGIN}/cors/credentials-wildcard-expose`, {
      mode: 'cors',
      credentials: 'include',
    });
    const text = await response.text();

    state.resolve();
    await state.done(() => {
      testing.expectEqual('cors', response.type);
      testing.expectEqual(200, response.status);
      testing.expectEqual('credentialed-wildcard', text);
      testing.expectEqual('text/plain', response.headers.get('content-type'));
      testing.expectEqual(null, response.headers.get('x-wildcard-credentials-proof'));
    });
  }
</script>
