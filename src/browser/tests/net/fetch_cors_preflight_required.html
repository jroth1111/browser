<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=fetch_cors_preflight_required type=module>
  {
    const state = await testing.async();

    let customHeaderBlocked = false;
    try {
      await fetch(`${testing.CORS_ORIGIN}/cors/preflight-blocked`, {
        mode: 'cors',
        headers: {
          'X-Needs-Preflight': '1',
        },
      });
    } catch (error) {
      customHeaderBlocked = error instanceof TypeError;
    }
    const customHeaderSnapshot = await (await fetch(`${testing.ORIGIN}/cors/read-preflight`)).json();

    let methodBlocked = false;
    try {
      await fetch(`${testing.CORS_ORIGIN}/cors/preflight-blocked`, {
        mode: 'cors',
        method: 'PUT',
        body: 'hello',
      });
    } catch (error) {
      methodBlocked = error instanceof TypeError;
    }
    const methodSnapshot = await (await fetch(`${testing.ORIGIN}/cors/read-preflight`)).json();

    state.resolve({ customHeaderSnapshot, methodSnapshot });
    await state.done(({ customHeaderSnapshot, methodSnapshot }) => {
      testing.expectEqual(true, customHeaderBlocked);
      testing.expectEqual(true, customHeaderSnapshot.preflightSeen);
      testing.expectEqual(true, customHeaderSnapshot.methodGet);
      testing.expectEqual(true, customHeaderSnapshot.headerMatches);
      testing.expectEqual(true, customHeaderSnapshot.originMatches);
      testing.expectEqual(true, customHeaderSnapshot.secFetchModeCors);
      testing.expectEqual(false, customHeaderSnapshot.actualSeen);
      testing.expectEqual(true, methodBlocked);
      testing.expectEqual(true, methodSnapshot.preflightSeen);
      testing.expectEqual(true, methodSnapshot.methodPut);
      testing.expectEqual(true, methodSnapshot.originMatches);
      testing.expectEqual(true, methodSnapshot.secFetchModeCors);
      testing.expectEqual(false, methodSnapshot.actualSeen);
    });
  }
</script>
