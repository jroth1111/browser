<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=javascript_url_iframe_collects_in_child_realm type=module>
  {
    const state = await testing.async();
    window.addEventListener('message', (event) => {
      state.resolve(event.data);
    });

    const iframe = document.createElement('iframe');
    iframe.src = "javascript:parent.postMessage({ messageSource: 'jsUrlCollect', value: top === parent, href: location.href }, '*')";
    document.documentElement.appendChild(iframe);

    await state.done((data) => {
      testing.expectEqual('jsUrlCollect', data.messageSource);
      testing.expectEqual(true, data.value);
      testing.expectEqual('about:blank', data.href);
    });
  }
</script>

<script id=sandboxed_javascript_url_iframe_blocks_script type=module>
  {
    const state = await testing.async();
    let received = false;
    const handler = (event) => {
      if (event.data && event.data.messageSource === 'sandboxedJsUrlCollect') {
        received = true;
      }
    };
    window.addEventListener('message', handler);

    const iframe = document.createElement('iframe');
    iframe.sandbox = 'allow-same-origin';
    iframe.src = "javascript:parent.postMessage({ messageSource: 'sandboxedJsUrlCollect' }, '*')";
    document.documentElement.appendChild(iframe);

    setTimeout(() => {
      window.removeEventListener('message', handler);
      state.resolve(received);
    }, 20);

    await state.done((didReceiveMessage) => {
      testing.expectEqual(false, didReceiveMessage);
      testing.expectEqual('about:blank', iframe.contentWindow.location.href);
    });
  }
</script>
