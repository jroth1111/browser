<!DOCTYPE html>
<script src="../../testing.js"></script>

<script id="Image">
{
    let i1 = new Image()
    testing.expectEqual(0, i1.width);
    testing.expectEqual(null, i1.getAttribute('width'));
    testing.expectEqual(0, i1.height);
    testing.expectEqual(null, i1.getAttribute('height'));

    let i2 = new Image(10)
    testing.expectEqual(10, i2.width);
    testing.expectEqual('10', i2.getAttribute('width'));
    testing.expectEqual(0, i2.height);
    testing.expectEqual(null, i2.getAttribute('height'));

    let i3 = new Image(10, 20)
    testing.expectEqual(10, i3.width);
    testing.expectEqual('10', i3.getAttribute('width'));
    testing.expectEqual(20, i3.height);
    testing.expectEqual('20', i3.getAttribute('height'));
}
</script>

<script id="src_alt">
{
    const img = document.createElement('img');

    testing.expectEqual('', img.src);
    testing.expectEqual('', img.alt);
    testing.expectEqual('', img.currentSrc);

    img.src = 'test.png';
    // src property returns resolved absolute URL
    testing.expectEqual(testing.BASE_URL + 'element/html/test.png', img.src);
    testing.expectEqual(testing.BASE_URL + 'element/html/test.png', img.currentSrc);
    // getAttribute returns the raw attribute value
    testing.expectEqual('test.png', img.getAttribute('src'));

    img.src = '/absolute/path.png';
    testing.expectEqual(testing.ORIGIN + '/absolute/path.png', img.src);
    testing.expectEqual('/absolute/path.png', img.getAttribute('src'));

    img.src = testing.CORS_ORIGIN + '/resource/record-image-headers.png';
    testing.expectEqual(testing.CORS_ORIGIN + '/resource/record-image-headers.png', img.src);
    testing.expectEqual(testing.CORS_ORIGIN + '/resource/record-image-headers.png', img.getAttribute('src'));

    img.alt = 'Test image';
    testing.expectEqual('Test image', img.alt);
    testing.expectEqual('Test image', img.getAttribute('alt'));
}
</script>

<script id="width_height_setters">
{
    const img = document.createElement('img');

    img.width = 100;
    testing.expectEqual(100, img.width);
    testing.expectEqual('100', img.getAttribute('width'));

    img.height = 200;
    testing.expectEqual(200, img.height);
    testing.expectEqual('200', img.getAttribute('height'));

    img.setAttribute('width', '50');
    testing.expectEqual(50, img.width);

    img.setAttribute('height', 'invalid');
    testing.expectEqual(0, img.height);
}
</script>

<script id="crossOrigin">
{
    const img = document.createElement('img');

    testing.expectEqual(null, img.crossOrigin);

    img.crossOrigin = 'anonymous';
    testing.expectEqual('anonymous', img.crossOrigin);
    testing.expectEqual('anonymous', img.getAttribute('crossorigin'));

    img.crossOrigin = null;
    testing.expectEqual(null, img.crossOrigin);
    testing.expectEqual(null, img.getAttribute('crossorigin'));
}
</script>

<script id="loading">
{
    const img = document.createElement('img');

    testing.expectEqual('eager', img.loading);

    img.loading = 'lazy';
    testing.expectEqual('lazy', img.loading);
    testing.expectEqual('lazy', img.getAttribute('loading'));
}
</script>

<script id="complete">
{
    // Image with no src is complete per spec
    const img = document.createElement('img');
    testing.expectEqual(true, img.complete);

    // Image with src is also complete after the native synchronous fetch.
    img.src = 'test.png';
    testing.expectEqual(true, img.complete);
    testing.expectEqual(2, img.naturalWidth);
    testing.expectEqual(3, img.naturalHeight);

    // Image constructor also complete
    const img2 = new Image();
    testing.expectEqual(true, img2.complete);
}
</script>

<script id="data_uri_dimensions">
{
  // data: URI images decode synchronously; naturalWidth/naturalHeight must
  // reflect the actual embedded image bytes, matching the http(s) fetch path.
  const img = document.createElement('img');
  img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVQYV2NgAAIAAAUAAarVyFEAAAAASUVORK5CYII=';
  testing.expectEqual(true, img.complete);
  testing.expectEqual(1, img.naturalWidth);
  testing.expectEqual(1, img.naturalHeight);
}
</script>

<script id="drawImage_from_img_decodes_real_pixels">
{
  // Canvas fingerprinting probes (e.g. PixelScan) draw a known image and hash
  // the resulting pixels; drawImage must sample the img's actual decoded
  // bytes, not throw or read uninitialized/blank memory. This fixture is a
  // 2x2 RGBA PNG with row 0 filter=None and row 1 filter=Up, independently
  // constructed+verified via python3's zlib/struct (not this engine).
  const img = document.createElement('img');
  img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAGUlEQVR42mP4z8DwHwgbmLhF5BgYGP8fAAA0UgV9Hfv1JQAAAABJRU5ErkJggg==';
  testing.expectEqual(true, img.complete);
  testing.expectEqual(2, img.naturalWidth);
  testing.expectEqual(2, img.naturalHeight);

  const canvas = document.createElement('canvas');
  canvas.width = 2;
  canvas.height = 2;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const p00 = ctx.getImageData(0, 0, 1, 1).data;
  testing.expectEqual(255, p00[0]);
  testing.expectEqual(0, p00[1]);
  testing.expectEqual(0, p00[2]);
  testing.expectEqual(255, p00[3]);

  const p01 = ctx.getImageData(1, 0, 1, 1).data;
  testing.expectEqual(0, p01[0]);
  testing.expectEqual(255, p01[1]);
  testing.expectEqual(0, p01[2]);
  testing.expectEqual(128, p01[3]);

  const p10 = ctx.getImageData(0, 1, 1, 1).data;
  testing.expectEqual(10, p10[0]);
  testing.expectEqual(20, p10[1]);
  testing.expectEqual(30, p10[2]);
  testing.expectEqual(255, p10[3]);

  const p11 = ctx.getImageData(1, 1, 1, 1).data;
  testing.expectEqual(0, p11[0]);
  testing.expectEqual(0, p11[1]);
  testing.expectEqual(255, p11[2]);
  testing.expectEqual(64, p11[3]);
}
</script>

<script id="drawImage_zero_dimension_img_throws">
{
  // An img with no natural dimensions (no src set) must still throw,
  // matching the existing zero-dimension Canvas/OffscreenCanvas contract,
  // rather than silently drawing garbage/uninitialized memory.
  const img = document.createElement('img');
  const canvas = document.createElement('canvas');
  canvas.width = 2;
  canvas.height = 2;
  const ctx = canvas.getContext('2d');
  testing.expectError('TypeError', () => ctx.drawImage(img, 0, 0));
}
</script>

<script id="img-load-event" type=module>
  // An img fires a load event when src is set.
  const state = await testing.async();
  const img = document.createElement("img");

  img.addEventListener("load", (e) => {
    state.resolve(e);
  });
  img.src = testing.CORS_ORIGIN + "/resource/record-image-headers.png";

  await state.done((e) => {
    testing.expectEqual(false, e.bubbles);
    testing.expectEqual(false, e.cancelBubble);
    testing.expectEqual(false, e.cancelable);
    testing.expectEqual(false, e.composed);
    testing.expectEqual(true, e.isTrusted);
    testing.expectEqual(img, e.target);
    testing.expectEqual(true, img.complete);
    testing.expectEqual(2, img.naturalWidth);
    testing.expectEqual(3, img.naturalHeight);
  });
</script>

<script id="img-no-load-without-src">
{
  // An img without src should not fire a load event.
  let fired = false;
  const img = document.createElement("img");
  img.addEventListener("load", () => { fired = true; });
  document.body.appendChild(img);
  testing.onload(() => testing.expectEqual(false, fired));
}
</script>

<script id="lazy-src-set">
{
  // Append to DOM first, then set src — load should still fire.
  const img = document.createElement("img");
  let result = false;
  img.onload = () => result = true;
  document.body.appendChild(img);
  img.src = testing.CORS_ORIGIN + "/resource/record-image-headers.png";

  testing.onload(() => testing.expectEqual(true, result));
}
</script>

<script id=url_encode>
  {
    let img = document.createElement('img');
    img.src = 'over 9000!?hello=world !';
    testing.expectEqual('over 9000!?hello=world !', img.getAttribute('src'));
    testing.expectEqual(testing.BASE_URL + 'element/html/over%209000!?hello=world%20!', img.src);
  }
</script>
