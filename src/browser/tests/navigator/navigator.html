<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=navigator>
  // Navigator should be accessible from window
  testing.expectEqual(navigator, window.navigator);
  testing.expectEqual(true, navigator.userAgent.length > 0);
  testing.expectEqual(true, navigator.userAgent.includes('Lightpanda'));
  testing.expectEqual('Netscape', navigator.appName);
  testing.expectEqual('1.0', navigator.appVersion);
  testing.expectEqual(true, navigator.platform.length > 0);

  // Platform should be one of the known values
  const validPlatforms = ['MacIntel', 'Win32', 'Linux x86_64', 'FreeBSD', 'Unknown'];
  testing.expectEqual(true, validPlatforms.includes(navigator.platform));
  testing.expectEqual('en-US', navigator.language);
  testing.expectEqual(true, Array.isArray(navigator.languages));
  testing.expectEqual(2, navigator.languages.length);
  testing.expectEqual('en-US', navigator.languages[0]);
  testing.expectEqual('en', navigator.languages[1]);
  testing.expectEqual(true, navigator.onLine);
  testing.expectEqual(true, navigator.cookieEnabled);
  testing.expectEqual(true, navigator.hardwareConcurrency > 0);
  testing.expectEqual(4, navigator.hardwareConcurrency);
  testing.expectEqual(0, navigator.maxTouchPoints);
  testing.expectEqual('', navigator.vendor);
  testing.expectEqual('Gecko', navigator.product);
  testing.expectEqual(false, navigator.javaEnabled());
  testing.expectEqual(false, navigator.webdriver);
  testing.expectEqual(false, navigator.pdfViewerEnabled);

  testing.expectEqual(null, navigator.doNotTrack);

  // GPC must not be exposed at all unless the user has explicitly turned it
  // on — per https://w3c.github.io/gpc/#javascript-property real Chrome does
  // not define navigator.globalPrivacyControl when GPC isn't enabled, so
  // accessing it yields undefined (not a false-valued property). A defined
  // false default is itself a bot tell versus real Chrome's absent property.
  testing.expectEqual(undefined, navigator.globalPrivacyControl);

  // Every Navigator attribute must be a native accessor on the prototype
  // (globalPrivacyControl is intentionally excluded: it does not exist on
  // Navigator.prototype at all when GPC is off, matching real Chrome).
  for (const name of [
    'userAgent', 'appName', 'appCodeName', 'appVersion', 'platform',
    'language', 'languages', 'onLine', 'cookieEnabled', 'hardwareConcurrency',
    'deviceMemory', 'maxTouchPoints', 'vendor', 'product', 'webdriver',
    'plugins', 'mimeTypes', 'pdfViewerEnabled', 'doNotTrack',
    'webkitTemporaryStorage', 'webkitPersistentStorage', 'mediaDevices',
  ]) {
    const desc = Object.getOwnPropertyDescriptor(Navigator.prototype, name);
    testing.expectEqual('function', typeof desc.get); // accessor on prototype
    testing.expectEqual(undefined, desc.value);        // not a data property
    testing.expectEqual(undefined, Object.getOwnPropertyDescriptor(navigator, name)); // not own
    testing.expectEqual(true, desc.get.toString().includes('[native code]'));
  }
</script>

<script id=mediaDevices type=module>
  {
    testing.expectEqual('function', typeof MediaDevices);
    testing.expectEqual('function', typeof MediaDeviceInfo);

    const desc = Object.getOwnPropertyDescriptor(Navigator.prototype, 'mediaDevices');
    testing.expectEqual('function', typeof desc.get);
    testing.expectEqual(true, desc.get.toString().includes('[native code]'));
    testing.expectEqual(undefined, Object.getOwnPropertyDescriptor(navigator, 'mediaDevices'));

    const mediaDevices = navigator.mediaDevices;
    testing.expectEqual(true, mediaDevices === navigator.mediaDevices);
    testing.expectEqual('[object MediaDevices]', Object.prototype.toString.call(mediaDevices));
    testing.expectEqual(true, mediaDevices instanceof MediaDevices);
    testing.expectEqual('function', typeof mediaDevices.enumerateDevices);
    testing.expectEqual(true, mediaDevices.enumerateDevices.toString().includes('[native code]'));
    testing.expectEqual(true, mediaDevices.getUserMedia.toString().includes('[native code]'));
    testing.expectEqual(true, mediaDevices.getDisplayMedia.toString().includes('[native code]'));
    testing.expectEqual(true, mediaDevices.addEventListener.toString().includes('[native code]'));
    testing.expectEqual(true, mediaDevices.removeEventListener.toString().includes('[native code]'));
    testing.expectEqual(true, mediaDevices.dispatchEvent.toString().includes('[native code]'));

    const devices = await mediaDevices.enumerateDevices();
    const kinds = devices.map((device) => device.kind);
    testing.expectEqual(true, Array.isArray(devices));
    testing.expectEqual(3, devices.length);
    testing.expectEqual(1, kinds.filter((kind) => kind === 'audioinput').length);
    testing.expectEqual(1, kinds.filter((kind) => kind === 'videoinput').length);
    testing.expectEqual(1, kinds.filter((kind) => kind === 'audiooutput').length);
    for (const device of devices) {
      testing.expectEqual('[object MediaDeviceInfo]', Object.prototype.toString.call(device));
      testing.expectEqual(true, device instanceof MediaDeviceInfo);
      testing.expectEqual('', device.deviceId);
      testing.expectEqual('', device.label);
      testing.expectEqual('', device.groupId);
      testing.expectEqual({
        deviceId: device.deviceId,
        kind: device.kind,
        label: device.label,
        groupId: device.groupId,
      }, device.toJSON());
      testing.expectEqual(true, device.toJSON.toString().includes('[native code]'));
    }

    try {
      await mediaDevices.getUserMedia({audio: true});
      testing.fail('getUserMedia should reject without a granted capture device');
    } catch (e) {
      testing.expectEqual('NotAllowedError', e.name);
    }
    try {
      await mediaDevices.getDisplayMedia({video: true});
      testing.fail('getDisplayMedia should reject without a granted capture device');
    } catch (e) {
      testing.expectEqual('NotAllowedError', e.name);
    }
  }
</script>

<script id=navigator_native_descriptor_walk>
  // Mirror the bot-detection fingerprint: read every navigator property's
  // descriptor and call toString() on its value/getter. This must not throw.
  let obj = navigator;
  do {
    for (const name of Object.getOwnPropertyNames(obj)) {
      const d = Object.getOwnPropertyDescriptor(obj, name);
      if (d.value !== undefined) { d.value.toString(); }
      else if (d.get !== undefined) { d.get.toString(); }
    }
  } while (obj = Object.getPrototypeOf(obj));
  testing.expectEqual(null, navigator.doNotTrack);
</script>

<script id=deprecated_storage_quota type=module>
  {
    testing.expectEqual(true, navigator.webkitTemporaryStorage === navigator.webkitTemporaryStorage);
    testing.expectEqual(true, navigator.webkitPersistentStorage === navigator.webkitPersistentStorage);
    testing.expectEqual('function', typeof navigator.webkitTemporaryStorage.queryUsageAndQuota);
    testing.expectEqual('function', typeof navigator.webkitTemporaryStorage.requestQuota);
    testing.expectEqual(true, navigator.webkitTemporaryStorage.queryUsageAndQuota.toString().includes('[native code]'));
    testing.expectEqual(true, navigator.webkitTemporaryStorage.requestQuota.toString().includes('[native code]'));

    const state = await testing.async();
    navigator.webkitTemporaryStorage.queryUsageAndQuota((usage, quota) => {
      state.resolve({usage, quota});
    }, () => testing.fail('temporary storage quota should resolve'));

    await state.done((estimate) => {
      testing.expectEqual(0, estimate.usage);
      testing.expectEqual(5 * 1024 * 1024 * 1024, estimate.quota);
    });
  }
</script>

<script id=deprecated_storage_request_quota type=module>
  {
    const state = await testing.async();
    navigator.webkitPersistentStorage.requestQuota(4096, (granted) => {
      state.resolve(granted);
    }, () => testing.fail('persistent storage quota should resolve'));

    await state.done((granted) => {
      testing.expectEqual(4096, granted);
    });
  }
</script>

<script id=permission_query type=module>
  {
    const state = await testing.async();
    const p = navigator.permissions.query({ name: 'notifications' });
    testing.expectTrue(p instanceof Promise);
    const status = await p;
    state.resolve();

    await state.done(() => {
      testing.expectEqual('prompt', status.state);
      testing.expectEqual('notifications', status.name);
    });
  }
</script>

<script id=geolocation_unmanaged_error_callback type=module>
  {
    const state = await testing.async();

    testing.expectEqual('object', typeof navigator.geolocation);
    testing.expectEqual(true, navigator.geolocation instanceof Geolocation);
    testing.expectEqual('function', typeof navigator.geolocation.getCurrentPosition);
    testing.expectEqual('function', typeof navigator.geolocation.watchPosition);
    testing.expectEqual('function', typeof navigator.geolocation.clearWatch);

    navigator.geolocation.getCurrentPosition(
      () => testing.fail('geolocation should not return an unmanaged fallback position'),
      (error) => state.resolve(error)
    );

    await state.done((error) => {
      testing.expectEqual(true, error instanceof GeolocationPositionError);
      testing.expectEqual(GeolocationPositionError.PERMISSION_DENIED, error.code);
      testing.expectEqual('User denied Geolocation', error.message);
    });
  }
</script>

<script id=storage_estimate type=module>
  {
    const state = await testing.async();

    const p = navigator.storage.estimate();
    testing.expectTrue(p instanceof Promise);
    testing.expectEqual('function', typeof navigator.storage.persist);
    testing.expectEqual('function', typeof navigator.storage.persisted);

    const estimate = await p;
    const persist = await navigator.storage.persist();
    const persisted = await navigator.storage.persisted();
    state.resolve();

    await state.done(() =>{
      testing.expectEqual(0, estimate.usage);
      testing.expectEqual(5 * 1024 * 1024 * 1024, estimate.quota);
      testing.expectEqual(false, persist);
      testing.expectEqual(false, persisted);
    });
  }
</script>

<script id=deviceMemory>
  testing.expectEqual(8, navigator.deviceMemory);
</script>

<script id=userAgentData>
  testing.expectEqual(true, navigator.userAgentData !== undefined);
  testing.expectEqual(false, navigator.userAgentData.mobile);
  testing.expectEqual(true, navigator.userAgentData.platform.length > 0);

  const validUAPlatforms = ['macOS', 'Windows', 'Linux', 'FreeBSD', 'Unknown'];
  testing.expectEqual(true, validUAPlatforms.includes(navigator.userAgentData.platform));

  testing.expectEqual(1, navigator.userAgentData.brands.length);
  testing.expectEqual({brand: 'Lightpanda', version: "1"}, navigator.userAgentData.brands[0]);

  // Same instance returned on repeated access
  testing.expectEqual(true, navigator.userAgentData === navigator.userAgentData);

  const json = navigator.userAgentData.toJSON();
  testing.expectEqual(false, json.mobile);
  testing.expectEqual(navigator.userAgentData.platform, json.platform);
  testing.expectEqual(true, Array.isArray(json.brands));
  testing.expectEqual('Lightpanda', json.brands[0].brand);
</script>

<script id=userAgentData_highEntropy type=module>
  {
    const state = await testing.async();
    const p = navigator.userAgentData.getHighEntropyValues(['architecture', 'platformVersion', 'fullVersionList', 'uaFullVersion', 'wow64', 'formFactors']);
    testing.expectTrue(p instanceof Promise);
    const v = await p;
    state.resolve();

    await state.done(() => {
      testing.expectEqual(false, v.mobile);
      testing.expectEqual(navigator.userAgentData.platform, v.platform);
      testing.expectEqual(true, Array.isArray(v.brands));
      testing.expectEqual(true, Array.isArray(v.fullVersionList));
      testing.expectEqual('Lightpanda', v.fullVersionList[0].brand);
      testing.expectEqual('1.0.0.0', v.uaFullVersion);
      testing.expectEqual(false, v.wow64);
      testing.expectEqual(true, Array.isArray(v.formFactor));
      testing.expectEqual('Desktop', v.formFactor[0]);
    });
  }
</script>

<script id=getBattery type=module>
  // Like Firefox, we don't expose navigator.getBattery. Sites already
  // have to handle it being undefined, so this is a real-browser shape
  // rather than a stub that always rejects.
  testing.expectEqual('undefined', typeof navigator.getBattery);
</script>
